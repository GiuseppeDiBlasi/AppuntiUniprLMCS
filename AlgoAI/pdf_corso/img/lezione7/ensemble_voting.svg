<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" font-family="Times New Roman, Liberation Serif, serif" font-size="14" font-weight="bold" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="640" height="300" fill="#fff"/>

  <!-- Data (cilindro) -->
  <path d="M20,125 L20,205 A40,12 0 0 0 100,205 L100,125" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <ellipse cx="60" cy="125" rx="40" ry="12" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="60" y="172" text-anchor="middle">Data</text>

  <!-- Frecce tratteggiate Data -> classificatori -->
  <g stroke="#000" stroke-width="1.2" stroke-dasharray="2 3" fill="none" marker-end="url(#ah)">
    <path d="M100,150 L203,42"/>
    <path d="M100,165 L203,112"/>
    <path d="M100,185 L203,255"/>
  </g>

  <!-- Classificatori -->
  <g fill="#fff" stroke="#000" stroke-width="1.5">
    <rect x="205" y="22" width="50" height="36" rx="8"/>
    <rect x="205" y="92" width="50" height="36" rx="8"/>
    <rect x="205" y="237" width="50" height="36" rx="8"/>
  </g>
  <g text-anchor="middle" stroke="none">
    <text x="228" y="46">C<tspan font-size="10" dy="4">1</tspan></text>
    <text x="228" y="116">C<tspan font-size="10" dy="4">2</tspan></text>
    <text x="228" y="261">C<tspan font-size="10" dy="4">T</tspan></text>
    <text x="230" y="170" font-size="20">·</text>
    <text x="230" y="195" font-size="20">·</text>
  </g>

  <!-- Frecce classificatori -> Combine votes -->
  <g stroke="#000" stroke-width="1.2" fill="none" marker-end="url(#ah)">
    <path d="M255,40 L350,132"/>
    <path d="M255,110 L350,150"/>
    <path d="M255,255 L350,172"/>
  </g>

  <!-- New data sample -->
  <ellipse cx="385" cy="55" rx="52" ry="30" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="385" y="52" text-anchor="middle">New data</text>
  <text x="385" y="69" text-anchor="middle">sample</text>
  <path d="M385,85 L385,118" stroke="#000" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>

  <!-- Combine votes -->
  <rect x="350" y="120" width="70" height="64" rx="8" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="385" y="149" text-anchor="middle">Combine</text>
  <text x="385" y="166" text-anchor="middle">votes</text>

  <!-- Combine -> Class prediction -->
  <path d="M420,152 L483,152" stroke="#000" stroke-width="1.2" fill="none" marker-end="url(#ah)"/>

  <!-- Class prediction -->
  <ellipse cx="540" cy="152" rx="55" ry="32" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="540" y="149" text-anchor="middle">Class</text>
  <text x="540" y="166" text-anchor="middle">prediction</text>
</svg>
