<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 420" width="1160" height="420" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <style>
      .title { font-size: 52px; fill: #000; text-anchor: middle; }
      .head  { font-size: 23px; font-weight: bold; fill: #000; text-anchor: middle; }
      .box   { fill: #d9ead3; stroke: #222; stroke-width: 1.5; }
      .blue  { fill: #cfe2f3; }
      .label { font-size: 24px; fill: #000; text-anchor: middle; dominant-baseline: central; }
      .arrow { stroke: #000; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1160" height="420" fill="#fff"/>

  <!-- Regression -->
  <text class="title" x="215" y="92">Regression</text>
  <text class="title" x="215" y="152">Schema</text>

  <text class="head" x="496" y="66">Training Data</text>
  <rect class="box" x="426" y="77" width="141" height="38" rx="6"/>
  <text class="label" x="496" y="97">Size</text>
  <rect class="box" x="426" y="115" width="141" height="38" rx="6"/>
  <text class="label" x="496" y="135">Price</text>

  <text class="head" x="696" y="66">Test Data</text>
  <rect class="box" x="626" y="95" width="144" height="38" rx="6"/>
  <text class="label" x="698" y="115">Size</text>

  <text class="head" x="900" y="66">Prediction</text>
  <rect class="box" x="835" y="95" width="144" height="38" rx="6"/>
  <text class="label" x="907" y="115">Price</text>

  <line class="arrow" x1="770" y1="114" x2="834" y2="114"/>

  <!-- Classification -->
  <text class="title" x="215" y="280">Classification</text>
  <text class="title" x="215" y="340">Schema</text>

  <text class="head" x="508" y="234">Training Data</text>
  <rect class="box" x="437" y="245" width="143" height="38" rx="6"/>
  <text class="label" x="508" y="265">Height</text>
  <rect class="box" x="437" y="283" width="143" height="38" rx="6"/>
  <text class="label" x="508" y="303">Weight</text>
  <rect class="box blue" x="437" y="322" width="143" height="38" rx="6"/>
  <text class="label" x="508" y="342">Species</text>

  <text class="head" x="710" y="234">Test Data</text>
  <rect class="box" x="639" y="245" width="143" height="38" rx="6"/>
  <text class="label" x="710" y="265">Height</text>
  <rect class="box" x="639" y="283" width="143" height="38" rx="6"/>
  <text class="label" x="710" y="303">Weight</text>

  <text class="head" x="912" y="234">Prediction</text>
  <rect class="box blue" x="841" y="264" width="143" height="38" rx="6"/>
  <text class="label" x="912" y="284">Species</text>

  <line class="arrow" x1="782" y1="265" x2="840" y2="283"/>
  <line class="arrow" x1="782" y1="302" x2="840" y2="284"/>
</svg>
