<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1530 440" width="1530" height="440" font-family="Calibri, Carlito, Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#888"/>
    </marker>
    <style>
      .t  { font-size: 23px; fill: #111; text-anchor: middle; dominant-baseline: central; }
      .s  { font-size: 17px; fill: #111; dominant-baseline: central; }
      .train { fill: #d9dde6; stroke: #222; stroke-width: 1.5; }
      .test  { fill: #b3138f; stroke: #222; stroke-width: 1.5; }
      .a  { stroke: #111; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
      .ag { stroke: #888; stroke-width: 1.8; fill: none; marker-end: url(#ahg); }
    </style>
  </defs>
  <rect width="1530" height="440" fill="#fff"/>

  <!-- Dataset -->
  <rect class="train" x="79" y="22" width="367" height="51"/>
  <text class="t" x="262" y="48">Dataset</text>
  <text class="s" x="74" y="103">Create stratified folds</text>
  <line class="a" x1="262" y1="111" x2="262" y2="138"/>

  <!-- Fold 1 (large) -->
  <rect class="train" x="79" y="140" width="367" height="52"/>
  <rect class="test" x="373" y="140" width="73" height="52"/>
  <text class="t" x="225" y="166">Train</text>
  <text class="t" x="409" y="166">Test</text>
  <line class="a" x1="447" y1="166" x2="532" y2="166"/>

  <!-- Remaining folds -->
  <rect class="train" x="79" y="210" width="367" height="27"/>
  <rect class="test" x="299" y="210" width="74" height="27"/>
  <line class="ag" x1="447" y1="224" x2="490" y2="224"/>

  <rect class="train" x="79" y="256" width="367" height="27"/>
  <rect class="test" x="224" y="256" width="74" height="27"/>
  <line class="ag" x1="447" y1="270" x2="490" y2="270"/>

  <rect class="train" x="79" y="301" width="367" height="27"/>
  <rect class="test" x="151" y="301" width="73" height="27"/>
  <line class="ag" x1="447" y1="315" x2="490" y2="315"/>

  <rect class="train" x="79" y="347" width="367" height="27"/>
  <rect class="test" x="79" y="347" width="73" height="27"/>
  <line class="ag" x1="447" y1="361" x2="490" y2="361"/>

  <!-- Repeat for each fold box -->
  <rect x="492" y="70" width="671" height="304" fill="none" stroke="#999" stroke-width="2"/>
  <text class="s" x="503" y="92" style="font-size:22px">Repeat for each fold</text>

  <rect class="train" x="533" y="139" width="295" height="53"/>
  <text class="t" x="680" y="166">Train</text>

  <rect class="test" x="898" y="139" width="74" height="53"/>
  <text class="t" x="935" y="166">Test</text>

  <polygon points="735,275 752,247 849,247 866,275 849,302 752,302" fill="#fff" stroke="#222" stroke-width="1.8"/>
  <text class="t" x="800" y="275">Model</text>

  <line class="a" x1="697" y1="192" x2="735" y2="270"/>
  <text class="s" x="592" y="239">Learn model</text>

  <line class="a" x1="866" y1="275" x2="934" y2="193"/>
  <text class="s" x="908" y="239">Apply model</text>

  <!-- Metrics -->
  <line class="a" x1="972" y1="166" x2="1196" y2="166"/>
  <text class="s" x="991" y="149">Calculate metrics</text>

  <rect x="1198" y="102" width="140" height="128" rx="42" fill="#fff" stroke="#222" stroke-width="1.8"/>
  <text class="t" x="1267" y="150">Stored</text>
  <text class="t" x="1267" y="183">metrics</text>
</svg>
