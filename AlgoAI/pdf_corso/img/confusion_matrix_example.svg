<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 550" width="750" height="550" style="background-color: #ffffff; font-family: Arial, Helvetica, sans-serif;">

  <style>
    .header-text { font-size: 24px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .cell-text { font-size: 32px; font-weight: bold; fill: #000000; text-anchor: middle; dominant-baseline: central; }
    .outer-border { stroke: #000000; stroke-width: 2; }
    .inner-border { stroke: #000000; stroke-width: 1.5; }
  </style>

  <defs>
    <!-- Pallone da Calcio -->
    <g id="soccer-ball">
      <circle cx="40" cy="40" r="33" fill="#ffffff" stroke="#000000" stroke-width="2"/>
      <!-- Pentagono centrale -->
      <polygon points="40,27.5 49.5,34.4 45.9,45.5 34.1,45.5 30.5,34.4" fill="#000000"/>
      <!-- Patch nere esterne -->
      <path d="M 40,27.5 L 30.5,34.4 L 18,28 L 22,12 L 35,8 Z" fill="#000000" clip-path="url(#soccer-clip)"/>
      <path d="M 49.5,34.4 L 45.9,45.5 L 61,52 L 71,40 L 62,28 Z" fill="#000000" clip-path="url(#soccer-clip)"/>
      <path d="M 34.1,45.5 L 30.5,34.4 L 18,28 L 9,40 L 19,52 Z" fill="#000000" clip-path="url(#soccer-clip)"/>
      <path d="M 40,27.5 L 49.5,34.4 L 62,28 L 58,12 L 45,8 Z" fill="#000000" clip-path="url(#soccer-clip)"/>
      <path d="M 45.9,45.5 L 34.1,45.5 L 31,62 L 40,71 L 49,62 Z" fill="#000000" clip-path="url(#soccer-clip)"/>
      <circle cx="40" cy="40" r="33" fill="none" stroke="#000000" stroke-width="2"/>
    </g>

    <clipPath id="soccer-clip">
      <circle cx="40" cy="40" r="32.5"/>
    </clipPath>

    <!-- Palla da Basket -->
    <g id="basketball">
      <circle cx="40" cy="40" r="33" fill="#ee6825" stroke="#000000" stroke-width="2"/>
      <line x1="40" y1="7" x2="40" y2="73" stroke="#000000" stroke-width="2"/>
      <line x1="7" y1="40" x2="73" y2="40" stroke="#000000" stroke-width="2"/>
      <path d="M 21 11 C 32 25, 32 55, 21 69" fill="none" stroke="#000000" stroke-width="2"/>
      <path d="M 59 11 C 48 25, 48 55, 59 69" fill="none" stroke="#000000" stroke-width="2"/>
    </g>
  </defs>

  <g transform="translate(40, 30)">
    <!-- Intestazione Superiore "Real" -->
    <rect x="310" y="20" width="280" height="70" fill="#d0d0d0" class="outer-border"/>
    <text x="450" y="55" class="header-text">Real</text>

    <!-- Sub-intestazioni Colonne (Icone) -->
    <!-- Colonna Calcio -->
    <rect x="310" y="90" width="140" height="110" fill="#ffffff" class="outer-border"/>
    <rect x="322" y="100" width="18" height="90" fill="#a0a0a0"/>
    <rect x="420" y="100" width="18" height="90" fill="#a0a0a0"/>
    <use href="#soccer-ball" x="340" y="105"/>

    <!-- Colonna Basket -->
    <rect x="450" y="90" width="140" height="110" fill="#ffffff" class="outer-border"/>
    <rect x="462" y="100" width="18" height="90" fill="#a0a0a0"/>
    <rect x="560" y="100" width="18" height="90" fill="#a0a0a0"/>
    <use href="#basketball" x="480" y="105"/>

    <!-- Intestazione Laterale "Predicted" -->
    <rect x="80" y="200" width="70" height="220" fill="#e2e2e2" class="outer-border"/>
    <text x="115" y="310" class="header-text" transform="rotate(-90 115 310)">Predicted</text>

    <!-- Sub-intestazioni Righe (Icone) -->
    <!-- Riga Calcio -->
    <rect x="150" y="200" width="160" height="110" fill="#ffffff" class="outer-border"/>
    <rect x="162" y="210" width="18" height="90" fill="#a0a0a0"/>
    <rect x="280" y="210" width="18" height="90" fill="#a0a0a0"/>
    <use href="#soccer-ball" x="190" y="215"/>

    <!-- Riga Basket -->
    <rect x="150" y="310" width="160" height="110" fill="#ffffff" class="outer-border"/>
    <rect x="162" y="320" width="18" height="90" fill="#a0a0a0"/>
    <rect x="280" y="320" width="18" height="90" fill="#a0a0a0"/>
    <use href="#basketball" x="190" y="325"/>

    <!-- CELLE MATRICE DI CONFUSIONE -->

    <!-- Cella (1,1): Predicted Soccer, Real Soccer -> Verde chiaro, 1 -->
    <rect x="310" y="200" width="140" height="110" fill="#d3ead3" class="outer-border"/>
    <text x="380" y="255" class="cell-text">1</text>

    <!-- Cella (1,2): Predicted Soccer, Real Basketball -> Sfondo verde, box rosa con 2 -->
    <rect x="450" y="200" width="140" height="110" fill="#d3ead3" class="outer-border"/>
    <rect x="462" y="215" width="116" height="80" fill="#f8d5d8" class="inner-border"/>
    <text x="520" y="255" class="cell-text">2</text>

    <!-- Cella (2,1): Predicted Basketball, Real Soccer -> Sfondo rosa, box verde con 0 -->
    <rect x="310" y="310" width="140" height="110" fill="#f8d5d8" class="outer-border"/>
    <rect x="322" y="325" width="116" height="80" fill="#d3ead3" class="inner-border"/>
    <text x="380" y="365" class="cell-text">0</text>

    <!-- Cella (2,2): Predicted Basketball, Real Basketball -> Sfondo rosa, 7 -->
    <rect x="450" y="310" width="140" height="110" fill="#f8d5d8" class="outer-border"/>
    <text x="520" y="365" class="cell-text">7</text>

  </g>
</svg>
