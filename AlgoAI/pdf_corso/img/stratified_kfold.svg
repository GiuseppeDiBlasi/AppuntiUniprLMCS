<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="1160" height="520" font-family="DejaVu Sans, Verdana, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { fill: #000; }
    .title { font-size: 32px; text-anchor: middle; }
    .tick  { font-size: 21px; }
    .lab   { font-size: 21px; text-anchor: middle; }
    .ytick { font-size: 21px; text-anchor: end; dominant-baseline: central; }
    .xtick { font-size: 21px; text-anchor: middle; }
    .leg   { font-size: 24px; dominant-baseline: central; }
    .tr { fill: #6989ee; }
    .te { fill: #e26a52; }
  </style>
  <rect width="1160" height="520" fill="#fff"/>

  <!-- Title -->
  <text class="title" x="522" y="40">StratifiedKFold</text>

  <!-- CV iterations: training base + testing segments -->
  <!-- 0 -->
  <rect class="tr" x="223" y="82" width="598" height="26"/>
  <rect class="te" x="223" y="82" width="10" height="26"/>
  <rect class="te" x="277" y="82" width="42" height="26"/>
  <rect class="te" x="453" y="82" width="93" height="26"/>
  <!-- 1 -->
  <rect class="tr" x="223" y="139" width="598" height="26"/>
  <rect class="te" x="233" y="139" width="20" height="26"/>
  <rect class="te" x="319" y="139" width="42" height="26"/>
  <rect class="te" x="546" y="139" width="87" height="26"/>
  <!-- 2 -->
  <rect class="tr" x="223" y="196" width="598" height="26"/>
  <rect class="te" x="253" y="196" width="12" height="26"/>
  <rect class="te" x="361" y="196" width="44" height="26"/>
  <rect class="te" x="633" y="196" width="92" height="26"/>
  <!-- 3 -->
  <rect class="tr" x="223" y="252" width="598" height="26"/>
  <rect class="te" x="265" y="252" width="12" height="26"/>
  <rect class="te" x="405" y="252" width="48" height="26"/>
  <rect class="te" x="725" y="252" width="96" height="26"/>

  <!-- class row -->
  <rect x="223" y="309" width="54" height="26" fill="#a6cee3"/>
  <rect x="277" y="309" width="176" height="26" fill="#fdbf6f"/>
  <rect x="453" y="309" width="368" height="26" fill="#b15928"/>

  <!-- group row -->
  <rect x="223" y="365" width="71" height="26" fill="#a6cee3"/>
  <rect x="294" y="365" width="29" height="26" fill="#1f78b4"/>
  <rect x="323" y="365" width="43" height="26" fill="#b2df8a"/>
  <rect x="366" y="365" width="46" height="26" fill="#fb9a99"/>
  <rect x="412" y="365" width="67" height="26" fill="#e31a1c"/>
  <rect x="479" y="365" width="124" height="26" fill="#fdbf6f"/>
  <rect x="603" y="365" width="24" height="26" fill="#cab2d6"/>
  <rect x="627" y="365" width="84" height="26" fill="#6a3d9a"/>
  <rect x="711" y="365" width="71" height="26" fill="#ffff99"/>
  <rect x="782" y="365" width="39" height="26" fill="#b15928"/>

  <!-- Axes frame -->
  <rect x="223" y="53" width="598" height="364" fill="none" stroke="#000" stroke-width="1.8"/>

  <!-- Y ticks -->
  <g stroke="#000" stroke-width="1.8">
    <line x1="216" y1="95" x2="223" y2="95"/>
    <line x1="216" y1="152" x2="223" y2="152"/>
    <line x1="216" y1="209" x2="223" y2="209"/>
    <line x1="216" y1="265" x2="223" y2="265"/>
    <line x1="216" y1="322" x2="223" y2="322"/>
    <line x1="216" y1="378" x2="223" y2="378"/>
  </g>
  <text class="ytick" x="206" y="95">0</text>
  <text class="ytick" x="206" y="152">1</text>
  <text class="ytick" x="206" y="209">2</text>
  <text class="ytick" x="206" y="265">3</text>
  <text class="ytick" x="206" y="322">class</text>
  <text class="ytick" x="206" y="378">group</text>

  <!-- X ticks -->
  <g stroke="#000" stroke-width="1.8">
    <line x1="223" y1="417" x2="223" y2="424"/>
    <line x1="343" y1="417" x2="343" y2="424"/>
    <line x1="462" y1="417" x2="462" y2="424"/>
    <line x1="582" y1="417" x2="582" y2="424"/>
    <line x1="702" y1="417" x2="702" y2="424"/>
    <line x1="821" y1="417" x2="821" y2="424"/>
  </g>
  <text class="xtick" x="223" y="452">0</text>
  <text class="xtick" x="343" y="452">20</text>
  <text class="xtick" x="462" y="452">40</text>
  <text class="xtick" x="582" y="452">60</text>
  <text class="xtick" x="702" y="452">80</text>
  <text class="xtick" x="821" y="452">100</text>

  <!-- Axis labels -->
  <text class="lab" x="522" y="490">Sample index</text>
  <text class="lab" transform="translate(108 235) rotate(-90)">CV iteration</text>

  <!-- Legend -->
  <rect x="842" y="56" width="50" height="25" fill="#f08a6c"/>
  <text class="leg" x="910" y="68">Testing set</text>
  <rect x="842" y="94" width="50" height="25" fill="#4055cc"/>
  <text class="leg" x="910" y="106">Training set</text>
</svg>
