<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 330" width="830" height="330" font-family="DejaVu Sans, Verdana, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="830" height="330" fill="#fff"/>

  <!-- ===== Precision ===== -->
  <text x="52" y="160" font-size="33" fill="#111">Precision =</text>
  <line x1="258" y1="148" x2="378" y2="148" stroke="#111" stroke-width="2"/>

  <!-- numerator: true positives -->
  <path d="M341,50 A46,41 0 0 0 341,132 Z" fill="#9fdc72"/>

  <!-- denominator: true positives + false positives -->
  <path d="M318,166 A46,40 0 0 0 318,246 Z" fill="#9fdc72"/>
  <path d="M318,166 A46,40 0 0 1 318,246 Z" fill="#f77f72"/>

  <!-- ===== Recall ===== -->
  <text x="465" y="147" font-size="33" fill="#111">Recall =</text>
  <line x1="627" y1="135" x2="741" y2="135" stroke="#111" stroke-width="2"/>

  <!-- numerator: true positives -->
  <path d="M710,38 A46,41 0 0 0 710,120 Z" fill="#9fdc72"/>

  <!-- denominator: all relevant elements (dark green) containing true positives -->
  <rect x="656" y="155" width="62" height="131" fill="#86a46a"/>
  <path d="M718,184 A46,40 0 0 0 718,264 Z" fill="#9fdc72"/>
</svg>
