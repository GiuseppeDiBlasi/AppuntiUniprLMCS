<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 880" width="1500" height="880" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-size: 28px; fill: #000; text-anchor: middle; dominant-baseline: central; }
    .b { font-weight: bold; }
    .cell { stroke: #000; stroke-width: 1.5; }
    .bar { stroke: #000; stroke-width: 1.5; stroke-linecap: butt; }
  </style>
  <rect width="1500" height="880" fill="#fff"/>

  <!-- Header: Actual class -->
  <rect class="cell" x="270" y="68" width="652" height="41" fill="#c0c0c0"/>
  <text class="b" x="596" y="89">Actual class</text>
  <rect class="cell" x="270" y="109" width="346" height="38" fill="#fff"/>
  <rect class="cell" x="616" y="109" width="306" height="38" fill="#fff"/>
  <text x="443" y="128">Positive</text>
  <text x="770" y="128">Negative</text>

  <!-- Side: Predicted class -->
  <rect class="cell" x="91" y="147" width="52" height="491" fill="#c0c0c0"/>
  <text class="b" transform="translate(117 393) rotate(-90)">Predicted class</text>
  <rect class="cell" x="143" y="147" width="127" height="273" fill="#fff"/>
  <rect class="cell" x="143" y="420" width="127" height="218" fill="#fff"/>
  <text transform="translate(205 283) rotate(-90)">Positive</text>
  <text transform="translate(205 529) rotate(-90)">Negative</text>

  <!-- Confusion matrix cells -->
  <rect class="cell" x="270" y="147" width="346" height="273" fill="#66ff66"/>
  <rect class="cell" x="616" y="147" width="306" height="273" fill="#ffff66"/>
  <rect class="cell" x="270" y="420" width="346" height="218" fill="#ffff66"/>
  <rect class="cell" x="616" y="420" width="306" height="218" fill="#66ff66"/>

  <text x="443" y="283"><tspan class="b">TP:</tspan> True Positive</text>
  <text x="769" y="264"><tspan class="b">FP:</tspan> False Positive</text>
  <text x="769" y="305">(Type I Error)</text>
  <text x="443" y="508"><tspan class="b">FN:</tspan> False Negative</text>
  <text x="443" y="549">(Type II Error)</text>
  <text x="769" y="528"><tspan class="b">TN:</tspan> True Negative</text>

  <!-- Right column: Precision / NPV -->
  <rect class="cell" x="922" y="147" width="403" height="273" fill="#fff"/>
  <rect class="cell" x="922" y="420" width="403" height="218" fill="#fff"/>

  <text class="b" x="1123" y="202">Precision:</text>
  <text class="b" x="1123" y="282">TP</text>
  <line class="bar" x1="1040" y1="323" x2="1208" y2="323"/>
  <text class="b" x="1123" y="362">(TP + FP)</text>

  <text class="b" x="1123" y="459">Negative Predictive Value:</text>
  <text class="b" x="1123" y="538">TN</text>
  <line class="bar" x1="1013" y1="580" x2="1233" y2="580"/>
  <text class="b" x="1123" y="619">(TN+FN)</text>

  <!-- Bottom row: Recall / Specificity / Accuracy -->
  <rect class="cell" x="270" y="638" width="346" height="197" fill="#fff"/>
  <rect class="cell" x="616" y="638" width="306" height="197" fill="#fff"/>
  <rect class="cell" x="922" y="638" width="403" height="197" fill="#fff"/>

  <text class="b" x="443" y="657">Recall or Sensitivity:</text>
  <text class="b" x="443" y="737">TP</text>
  <line class="bar" x1="360" y1="778" x2="528" y2="778"/>
  <text class="b" x="443" y="817">(TP + FN)</text>

  <text class="b" x="770" y="657">Specificity:</text>
  <text class="b" x="770" y="737">TN</text>
  <line class="bar" x1="658" y1="778" x2="880" y2="778"/>
  <text class="b" x="770" y="817">(TN + FP)</text>

  <text class="b" x="1123" y="657">Accuracy:</text>
  <text class="b" x="1123" y="737">TP + TN</text>
  <line class="bar" x1="985" y1="778" x2="1265" y2="778"/>
  <text class="b" x="1123" y="817">(TP + TN + FP + FN)</text>
</svg>
