<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 528" width="1200" height="528" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1200" height="528" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0L12,6L0,12z" fill="#000"/>
    </marker>
  </defs>

  <!-- Linee verticali tratteggiate -->
  <g stroke="#000" stroke-width="2" stroke-dasharray="7 5" fill="none">
    <line x1="162" y1="30" x2="162" y2="432"/>
    <line x1="256" y1="148" x2="256" y2="432"/>
    <line x1="482" y1="305" x2="482" y2="432"/>
    <line x1="601" y1="325" x2="601" y2="432"/>
    <line x1="713" y1="337" x2="713" y2="432"/>
  </g>
  <line x1="364" y1="275" x2="364" y2="432" stroke="#ff0000" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- Assi -->
  <g stroke="#000" stroke-width="3" fill="none">
    <line x1="97" y1="435" x2="97" y2="62"/>
    <line x1="97" y1="435" x2="852" y2="435"/>
  </g>
  <polygon points="97,46 88,70 106,70" fill="#000"/>
  <polygon points="870,435 846,426 846,444" fill="#000"/>

  <!-- Curva -->
  <polyline points="162,48 256,172 364,283 482,315 601,341 713,348 835,360"
            fill="none" stroke="#2ecc40" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Freccia -->
  <line x1="618" y1="152" x2="392" y2="266" stroke="#000" stroke-width="3.5" marker-end="url(#arrow)"/>

  <!-- Etichette assi -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" fill="#000">
    <text x="14" y="92" font-size="38">J<tspan font-size="26" dy="10">e</tspan></text>
    <text x="820" y="504" font-size="38">k</text>
  </g>

  <!-- Numeri sotto l'asse -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="38" text-anchor="middle" fill="#000">
    <text x="163" y="490">2</text>
    <text x="263" y="490">3</text>
    <text x="364" y="490" fill="#ff0000">4</text>
    <text x="482" y="490">5</text>
    <text x="601" y="490">6</text>
    <text x="713" y="490">7</text>
  </g>

  <!-- Testo annotazione -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="35" text-anchor="middle" fill="#000">
    <text x="910" y="90">per <tspan font-style="italic">k</tspan> = 4 il calo di <tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" dx="6">J</tspan><tspan font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="24" dy="10">e</tspan><tspan dy="-10" dx="4">rallenta</tspan></text>
    <text x="911" y="136">molto. La curva ricorda una</text>
    <text x="910" y="178">sorta di braccio dove 4</text>
    <text x="912" y="221">corrisponde al gomito</text>
  </g>
</svg>
