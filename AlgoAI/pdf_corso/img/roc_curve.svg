<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 690" width="1440" height="690" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-size: 30px; font-weight: bold; fill: #000; text-anchor: middle; dominant-baseline: central; }
    .green { fill: #2db84d; }
  </style>
  <rect width="1440" height="690" fill="#fff"/>

  <!-- Random model diagonal -->
  <line x1="477" y1="551" x2="1075" y2="48" stroke="#000" stroke-width="1.5"/>

  <!-- Right vertical green guide -->
  <line x1="1075" y1="48" x2="1075" y2="565" stroke="#2db84d" stroke-width="2"/>

  <!-- ROC curve -->
  <path d="M477,548 C490,470 510,360 580,240 C650,170 700,125 760,100 C830,70 900,50 1075,47"
        fill="none" stroke="#2db84d" stroke-width="9" stroke-linecap="round"/>

  <!-- Axes -->
  <line x1="477" y1="551" x2="477" y2="88" stroke="#000" stroke-width="7"/>
  <polygon points="477,55 456,93 498,93" fill="#000"/>
  <line x1="474" y1="551" x2="1068" y2="551" stroke="#000" stroke-width="7"/>
  <polygon points="1105,551 1066,530 1066,572" fill="#000"/>

  <!-- Labels -->
  <text x="258" y="281">TPR/ Recall/ Sensitivity</text>
  <text x="808" y="611">FPR = 1 - Specificity</text>
  <text class="green" x="797" y="284">Area Under Curve</text>
  <text x="1200" y="52">random model</text>

  <!-- Curved arrow to "random model" -->
  <path d="M1035,94 C1070,106 1108,104 1121,84" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>
  <polygon points="1112,70 1138,70 1130,100" fill="#000" transform="rotate(8 1125 82)"/>
</svg>
