<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 490" width="990" height="735" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <marker id="arrAx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <polygon id="star" fill="#e8222a"
      points="0,-17 4.11,-5.66 16.17,-5.25 6.66,2.16 9.99,13.75 0,7 -9.99,13.75 -6.66,2.16 -16.17,-5.25 -4.11,-5.66"/>
    <polygon id="tri" fill="#16a34a" points="0,-17 17,13 -17,13"/>
  </defs>

  <rect width="660" height="490" fill="#fff"/>

  <!-- Assi -->
  <line x1="95" y1="445" x2="95" y2="32" stroke="#111" stroke-width="2.5" marker-end="url(#arrAx)"/>
  <line x1="78" y1="430" x2="545" y2="430" stroke="#111" stroke-width="2.5" marker-end="url(#arrAx)"/>
  <text transform="translate(68,150) rotate(-90)" font-size="19" text-anchor="middle" fill="#111">Y-Axis</text>
  <text x="447" y="458" font-size="19" text-anchor="middle" fill="#111">X-Axis</text>

  <!-- Cerchi K=7 e K=3 -->
  <circle cx="315" cy="242" r="137" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="317" cy="243" r="82" fill="none" stroke="#111" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="283" y="288" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">K=3</text>
  <text x="288" y="354" font-size="17" font-weight="bold" text-anchor="middle" fill="#111">K=7</text>

  <!-- Classe A (stelle rosse) -->
  <use href="#star" x="178" y="78"/>
  <use href="#star" x="252" y="92"/>
  <use href="#star" x="167" y="138"/>
  <use href="#star" x="246" y="152"/>
  <use href="#star" x="316" y="128"/>
  <use href="#star" x="214" y="195"/>
  <use href="#star" x="290" y="210"/>

  <!-- Classe B (triangoli verdi) -->
  <use href="#tri" x="375" y="222"/>
  <use href="#tri" x="335" y="280"/>
  <use href="#tri" x="390" y="312"/>
  <use href="#tri" x="468" y="212"/>
  <use href="#tri" x="502" y="212"/>
  <use href="#tri" x="541" y="252"/>
  <use href="#tri" x="468" y="268"/>
  <use href="#tri" x="497" y="308"/>

  <!-- Nuovo esempio da classificare -->
  <rect x="312" y="221" width="34" height="34" fill="#f5a623" stroke="#b97a0a" stroke-width="1"/>
  <text x="329" y="246" font-size="22" font-weight="bold" text-anchor="middle" fill="#111">?</text>

  <text x="362" y="31" font-size="19" text-anchor="middle" fill="#222">New example</text>
  <text x="362" y="62" font-size="19" text-anchor="middle" fill="#222">to classify</text>
  <line x1="342" y1="74" x2="333" y2="216" stroke="#111" stroke-width="1.5" marker-end="url(#arrK)"/>

  <!-- Legenda -->
  <text x="500" y="58" font-size="29" font-weight="bold" text-anchor="middle" fill="#e8222a">Class A</text>
  <text x="500" y="106" font-size="29" font-weight="bold" text-anchor="middle" fill="#16a34a">Class B</text>
</svg>
