<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1366 768" width="1366" height="768" font-family="Arial, Helvetica, sans-serif">
  <rect width="1366" height="768" fill="#fff"/>

  <!-- Punti classe "o" (verdi) -->
  <g font-size="42" font-weight="bold" fill="#22b14c" text-anchor="middle" dominant-baseline="central">
    <text x="430" y="70">O</text>
    <text x="639" y="98">O</text>
    <text x="797" y="124">O</text>
    <text x="496" y="164">O</text>
    <text x="645" y="176">O</text>
    <text x="485" y="267">O</text>
    <text x="688" y="242">O</text>
    <text x="797" y="267">O</text>
    <text x="649" y="340">O</text>
  </g>

  <!-- Punti classe "x" (rossi) -->
  <g font-size="42" font-weight="bold" fill="#ff1d1d" text-anchor="middle" dominant-baseline="central">
    <text x="285" y="412">X</text>
    <text x="310" y="546">X</text>
    <text x="447" y="513">X</text>
    <text x="555" y="537">X</text>
    <text x="467" y="652">X</text>
    <text x="232" y="691">X</text>
    <text x="270" y="729">X</text>
  </g>

  <!-- Linee distanza -->
  <g stroke="#4472c4" stroke-width="3" stroke-linecap="round">
    <line x1="489" y1="296" x2="519" y2="353"/>
    <line x1="666" y1="260" x2="563" y2="348"/>
    <line x1="627" y1="348" x2="572" y2="384"/>
    <line x1="545" y1="412" x2="554" y2="495"/>
    <line x1="500" y1="396" x2="448" y2="481"/>
  </g>

  <!-- Stella blu (nuovo punto) -->
  <polygon transform="translate(538,380)" fill="#4472c4" stroke="#2f528f" stroke-width="2.5" stroke-linejoin="miter"
    points="0,-40 9.99,-13.75 38.04,-12.36 16.17,5.25 23.51,32.36 0,17 -23.51,32.36 -16.17,5.25 -38.04,-12.36 -9.99,-13.75"/>

  <!-- Etichette distanze -->
  <g font-size="26" fill="#000" text-anchor="middle" dominant-baseline="central">
    <text x="484" y="326">d<tspan font-size="17" dy="6">1</tspan></text>
    <text x="588" y="286">d<tspan font-size="17" dy="6">2</tspan></text>
    <text x="613" y="378">d<tspan font-size="17" dy="6">3</tspan></text>
    <text x="577" y="448">d<tspan font-size="17" dy="6">4</tspan></text>
    <text x="449" y="420">d<tspan font-size="17" dy="6">5</tspan></text>
  </g>

  <!-- Formula -->
  <g font-family="'Times New Roman', Times, serif" fill="#000" text-anchor="middle">
    <text x="647" y="463" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#22b14c" font-weight="bold">o:</text>

    <!-- 1/d1 -->
    <text x="686" y="443" font-size="24">1</text>
    <line x1="676" y1="450" x2="696" y2="450" stroke="#000" stroke-width="1.5"/>
    <text x="686" y="475" font-size="24" font-style="italic">d<tspan font-size="15" dy="5" font-style="normal">1</tspan></text>
    <text x="712" y="458" font-size="26">+</text>
    <!-- 1/d2 -->
    <text x="737" y="443" font-size="24">1</text>
    <line x1="727" y1="450" x2="747" y2="450" stroke="#000" stroke-width="1.5"/>
    <text x="737" y="475" font-size="24" font-style="italic">d<tspan font-size="15" dy="5" font-style="normal">2</tspan></text>
    <text x="762" y="458" font-size="26">+</text>
    <!-- 1/d3 -->
    <text x="787" y="443" font-size="24">1</text>
    <line x1="777" y1="450" x2="797" y2="450" stroke="#000" stroke-width="1.5"/>
    <text x="787" y="475" font-size="24" font-style="italic">d<tspan font-size="15" dy="5" font-style="normal">3</tspan></text>

    <text x="832" y="463" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#ff1d1d" font-weight="bold">x:</text>

    <!-- 1/d4 -->
    <text x="874" y="443" font-size="24">1</text>
    <line x1="864" y1="450" x2="884" y2="450" stroke="#000" stroke-width="1.5"/>
    <text x="874" y="475" font-size="24" font-style="italic">d<tspan font-size="15" dy="5" font-style="normal">4</tspan></text>
    <text x="900" y="458" font-size="26">+</text>
    <!-- 1/d5 -->
    <text x="925" y="443" font-size="24">1</text>
    <line x1="915" y1="450" x2="935" y2="450" stroke="#000" stroke-width="1.5"/>
    <text x="925" y="475" font-size="24" font-style="italic">d<tspan font-size="15" dy="5" font-style="normal">5</tspan></text>
  </g>

  <!-- Freccia e predizione -->
  <g fill="none" stroke="#000" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <line x1="975" y1="454" x2="1000" y2="454"/>
    <polyline points="991,444 1001,454 991,464"/>
  </g>
  <text x="1015" y="466" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#000">predict <tspan fill="#22b14c">o</tspan></text>
</svg>
