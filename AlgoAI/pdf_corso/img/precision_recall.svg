<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" font-family="DejaVu Sans, Verdana, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lbl { font-size: 21px; text-anchor: middle; }
    .dot { fill: #808080; }
    .ring { fill: none; stroke: #808080; stroke-width: 4; }
  </style>
  <rect width="640" height="720" fill="#fff"/>

  <!-- Background areas -->
  <rect x="23" y="62" width="256" height="551" fill="#d0dacb"/>
  <rect x="279" y="62" width="257" height="551" fill="#f0f0f0"/>

  <!-- Selected ellipse halves -->
  <path d="M279,176 A192,171 0 0 0 279,518 Z" fill="#c6f2a2"/>
  <path d="M279,176 A192,171 0 0 1 279,518 Z" fill="#ffaea8"/>
  <ellipse cx="279" cy="347" rx="192" ry="171" fill="none" stroke="#000" stroke-width="2.5"/>

  <!-- Bracket -->
  <text class="lbl" x="150" y="21" fill="#000">relevant elements</text>
  <path d="M28,47 V34 H273 V47" fill="none" stroke="#000" stroke-width="2"/>

  <!-- Labels -->
  <text class="lbl" x="152" y="97" fill="#3f4d3f">false negatives</text>
  <text class="lbl" x="407" y="97" fill="#444">true negatives</text>
  <text class="lbl" x="191" y="344" fill="#3a6a2a">true positives</text>
  <text class="lbl" x="371" y="344" fill="#8a2a2a">false positives</text>

  <!-- Relevant elements (filled) -->
  <g class="dot">
    <circle cx="63" cy="144" r="10"/>
    <circle cx="117" cy="156" r="10"/>
    <circle cx="225" cy="146" r="10"/>
    <circle cx="63" cy="240" r="10"/>
    <circle cx="228" cy="243" r="10"/>
    <circle cx="167" cy="280" r="10"/>
    <circle cx="223" cy="395" r="10"/>
    <circle cx="159" cy="414" r="10"/>
    <circle cx="83" cy="459" r="10"/>
    <circle cx="237" cy="467" r="10"/>
    <circle cx="64" cy="542" r="10"/>
    <circle cx="174" cy="546" r="10"/>
  </g>

  <!-- Non-relevant elements (rings) -->
  <g class="ring">
    <circle cx="353" cy="136" r="9"/>
    <circle cx="471" cy="155" r="9"/>
    <circle cx="483" cy="274" r="9"/>
    <circle cx="315" cy="258" r="9"/>
    <circle cx="385" cy="390" r="9"/>
    <circle cx="320" cy="460" r="9"/>
    <circle cx="481" cy="450" r="9"/>
    <circle cx="398" cy="533" r="9"/>
    <circle cx="322" cy="570" r="9"/>
    <circle cx="468" cy="572" r="9"/>
  </g>

  <!-- Selected elements callout -->
  <line x1="245" y1="517" x2="205" y2="645" stroke="#000" stroke-width="2"/>
  <text class="lbl" x="195" y="677" fill="#000">selected elements</text>
</svg>
