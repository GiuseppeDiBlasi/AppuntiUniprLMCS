<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 800" width="830" height="800" font-family="'Times New Roman', Times, serif" font-size="23" font-weight="bold" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 20 20" refX="10" refY="19" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M1,3 L10,19 L19,3" fill="none" stroke="#000" stroke-width="1.8"/>
    </marker>
  </defs>
  <rect width="830" height="800" fill="#fff"/>

  <!-- Frecce di flusso -->
  <g stroke="#000" stroke-width="2" fill="none">
    <line x1="316" y1="10" x2="316" y2="92" marker-end="url(#arr)"/>
    <line x1="316" y1="180" x2="316" y2="276" marker-end="url(#arr)"/>
    <line x1="322" y1="348" x2="322" y2="434" marker-end="url(#arr)"/>
    <line x1="322" y1="520" x2="322" y2="604" marker-end="url(#arr)"/>
    <line x1="326" y1="686" x2="326" y2="768" marker-end="url(#arr)"/>
  </g>

  <!-- Riquadri delle fasi -->
  <g fill="#fff" stroke="#000" stroke-width="2.5">
    <rect x="52" y="98" width="752" height="74" rx="14"/>
    <rect x="62" y="272" width="744" height="74" rx="14"/>
    <rect x="62" y="446" width="744" height="72" rx="14"/>
    <rect x="62" y="610" width="744" height="74" rx="14"/>
  </g>

  <!-- Simboli grigi e triangoli -->
  <g fill="#666" stroke="#000" stroke-width="2">
    <rect x="340" y="38" width="462" height="16"/>
    <rect x="460" y="240" width="223" height="17"/>
    <rect x="490" y="403" width="158" height="17"/>
    <rect x="514" y="555" width="89" height="16"/>
    <rect x="514" y="712" width="89" height="16"/>
  </g>
  <g fill="#fff" stroke="#000" stroke-width="2">
    <polygon points="562,182 460,226 677,226"/>
    <polygon points="566,370 492,402 648,402"/>
  </g>

  <!-- Etichette -->
  <g fill="#000">
    <text x="80" y="53">Dati</text>
    <text x="80" y="226">CF tree iniziale</text>
    <text x="55" y="396">CF tree più piccolo</text>
    <text x="62" y="576">Cluster buoni</text>
    <text x="55" y="740">Cluster migliori</text>

    <text x="78" y="143">Fase 1:</text>
    <text x="216" y="143">Caricamento in memoria costruendo un CF tree</text>

    <text x="80" y="302">Fase 2 (opzionale):</text>
    <text x="372" y="302">Riduzione a una dimensione adeguata</text>
    <text x="372" y="332">costruendo un CF tree più piccolo</text>

    <text x="86" y="488">Fase 3:</text>
    <text x="226" y="488">Clustering globale</text>

    <text x="72" y="660">Fase 4: (opzionale e offline)</text>
    <text x="400" y="660">: Raffinamento dei cluster</text>
  </g>
</svg>
