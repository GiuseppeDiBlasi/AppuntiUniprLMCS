<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 490" width="880" height="490" font-family="'Times New Roman', Times, serif" font-size="24" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="880" height="490" fill="#fff"/>
  <g fill="none" stroke="#000" stroke-width="1.8">

    <!-- ROOT NODE -->
    <rect x="165" y="28" width="447" height="90"/>
    <line x1="245" y1="28" x2="245" y2="118"/>
    <line x1="320" y1="28" x2="320" y2="118"/>
    <line x1="397" y1="28" x2="397" y2="118"/>
    <line x1="525" y1="28" x2="525" y2="118"/>
    <line x1="165" y1="72" x2="612" y2="72" stroke-dasharray="7 4" stroke-width="1.4"/>

    <!-- NON-LEAF NODE -->
    <rect x="83" y="222" width="445" height="90"/>
    <line x1="160" y1="222" x2="160" y2="312"/>
    <line x1="235" y1="222" x2="235" y2="312"/>
    <line x1="312" y1="222" x2="312" y2="312"/>
    <line x1="440" y1="222" x2="440" y2="312"/>
    <line x1="83" y1="267" x2="528" y2="267" stroke-dasharray="7 4" stroke-width="1.4"/>

    <!-- LEAF NODE 1 -->
    <rect x="28" y="395" width="352" height="60"/>
    <line x1="90" y1="395" x2="90" y2="455"/>
    <line x1="147" y1="395" x2="147" y2="455"/>
    <line x1="205" y1="395" x2="205" y2="455"/>
    <line x1="258" y1="395" x2="258" y2="455"/>
    <line x1="316" y1="395" x2="316" y2="455"/>

    <!-- LEAF NODE 2 -->
    <rect x="438" y="395" width="352" height="60"/>
    <line x1="498" y1="395" x2="498" y2="455"/>
    <line x1="557" y1="395" x2="557" y2="455"/>
    <line x1="613" y1="395" x2="613" y2="455"/>
    <line x1="670" y1="395" x2="670" y2="455"/>
    <line x1="727" y1="395" x2="727" y2="455"/>

    <!-- Pointer arrows: root -> children -->
    <line x1="208" y1="118" x2="120" y2="220" marker-end="url(#arr)"/>
    <line x1="280" y1="118" x2="666" y2="214" marker-end="url(#arr)"/>
    <line x1="345" y1="118" x2="810" y2="214" marker-end="url(#arr)"/>

    <!-- Pointer arrows: non-leaf -> leaves -->
    <line x1="118" y1="312" x2="83" y2="393" marker-end="url(#arr)"/>
    <line x1="195" y1="312" x2="638" y2="393" marker-end="url(#arr)"/>

    <!-- Doubly linked leaves -->
    <line x1="436" y1="408" x2="384" y2="408" marker-end="url(#arr)"/>
    <line x1="384" y1="440" x2="436" y2="440" marker-end="url(#arr)"/>
    <line x1="826" y1="425" x2="792" y2="425" marker-end="url(#arr)"/>
    <line x1="792" y1="447" x2="826" y2="447" marker-end="url(#arr)"/>
  </g>

  <g fill="#000" text-anchor="middle">
    <!-- Parameters -->
    <text x="30" y="68" text-anchor="start">B = 7</text>
    <text x="30" y="122" text-anchor="start">L = 6</text>

    <!-- Root keys -->
    <text x="205" y="62">CF<tspan font-size="16" dy="6">1</tspan></text>
    <text x="282" y="62">CF<tspan font-size="16" dy="6">2</tspan></text>
    <text x="358" y="62">CF<tspan font-size="16" dy="6">3</tspan></text>
    <text x="461" y="62" font-size="16">.......</text>
    <text x="568" y="62">CF<tspan font-size="16" dy="6">6</tspan></text>
    <!-- Root children -->
    <text x="205" y="105" font-size="19">child<tspan font-size="14" dy="5">1</tspan></text>
    <text x="282" y="105" font-size="19">child<tspan font-size="14" dy="5">2</tspan></text>
    <text x="358" y="105" font-size="19">child<tspan font-size="14" dy="5">3</tspan></text>
    <text x="568" y="105" font-size="19">child<tspan font-size="14" dy="5">6</tspan></text>

    <!-- Non-leaf label -->
    <text x="315" y="208">Non leaf node</text>

    <!-- Non-leaf keys -->
    <text x="121" y="256">CF<tspan font-size="16" dy="6">1</tspan></text>
    <text x="197" y="256">CF<tspan font-size="16" dy="6">2</tspan></text>
    <text x="273" y="256">CF<tspan font-size="16" dy="6">3</tspan></text>
    <text x="376" y="256" font-size="16">.......</text>
    <text x="483" y="256">CF<tspan font-size="16" dy="6">5</tspan></text>
    <!-- Non-leaf children -->
    <text x="121" y="299" font-size="19">child<tspan font-size="14" dy="5">1</tspan></text>
    <text x="197" y="299" font-size="19">child<tspan font-size="14" dy="5">2</tspan></text>
    <text x="273" y="299" font-size="19">child<tspan font-size="14" dy="5">3</tspan></text>
    <text x="483" y="299" font-size="19">child<tspan font-size="14" dy="5">5</tspan></text>

    <!-- Dots to the right -->
    <text x="722" y="274" font-size="16">..................</text>

    <!-- Leaf labels -->
    <text x="282" y="383">Leaf node</text>
    <text x="697" y="383">Leaf node</text>

    <!-- Leaf 1 -->
    <text x="59" y="433" font-size="20">prev</text>
    <text x="118" y="433">CF<tspan font-size="16" dy="6">1</tspan></text>
    <text x="176" y="433">CF<tspan font-size="16" dy="6">2</tspan></text>
    <text x="231" y="430" font-size="16">......</text>
    <text x="287" y="433">CF<tspan font-size="16" dy="6">6</tspan></text>
    <text x="348" y="433" font-size="20">next</text>

    <!-- Leaf 2 -->
    <text x="468" y="433" font-size="20">prev</text>
    <text x="527" y="433">CF<tspan font-size="16" dy="6">1</tspan></text>
    <text x="585" y="433">CF<tspan font-size="16" dy="6">2</tspan></text>
    <text x="641" y="430" font-size="16">......</text>
    <text x="698" y="433">CF<tspan font-size="16" dy="6">4</tspan></text>
    <text x="758" y="433" font-size="20">next</text>
  </g>
</svg>
