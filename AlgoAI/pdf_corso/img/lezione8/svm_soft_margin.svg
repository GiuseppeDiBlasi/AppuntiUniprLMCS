<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 690 440" width="690" height="440" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="690" height="440" fill="#fff"/>

  <!-- Axes -->
  <line x1="68" y1="418" x2="68" y2="62" stroke="#000" stroke-width="2.4" marker-end="url(#ax)"/>
  <line x1="57" y1="410" x2="510" y2="406" stroke="#000" stroke-width="2.4" marker-end="url(#ax)"/>

  <!-- Margin lines and decision boundary -->
  <line x1="105" y1="194" x2="462" y2="252" stroke="#e8141c" stroke-width="1.4" stroke-dasharray="2 2.5"/>
  <line x1="97" y1="236" x2="462" y2="295" stroke="#000" stroke-width="1.5"/>
  <line x1="93" y1="274" x2="445" y2="333" stroke="#1f2fe0" stroke-width="1.4" stroke-dasharray="2 2.5"/>

  <!-- Red class (open) -->
  <g fill="#fff" stroke="#e8141c" stroke-width="1.5">
    <circle cx="131" cy="116" r="8"/>
    <circle cx="156" cy="100" r="8"/>
    <circle cx="215" cy="117" r="8"/>
    <circle cx="260" cy="117" r="8"/>
    <circle cx="164" cy="150" r="8"/>
    <circle cx="280" cy="160" r="8"/>
    <circle cx="341" cy="150" r="8"/>
    <circle cx="389" cy="165" r="8"/>
    <circle cx="421" cy="213" r="8"/>
  </g>
  <!-- Red support vectors -->
  <ellipse cx="228" cy="213" rx="9" ry="8" fill="#ff0000" stroke="#e8141c" stroke-width="1.5"/>
  <ellipse cx="325" cy="230" rx="9" ry="8" fill="#ff0000" stroke="#e8141c" stroke-width="1.5"/>

  <!-- Blue class (open) -->
  <g fill="#fff" stroke="#1f2fe0" stroke-width="1.5">
    <circle cx="114" cy="294" r="8"/>
    <circle cx="147" cy="342" r="8"/>
    <circle cx="260" cy="326" r="8"/>
    <circle cx="260" cy="358" r="8"/>
    <circle cx="292" cy="375" r="8"/>
    <circle cx="357" cy="358" r="8"/>
  </g>
  <!-- Blue support vector -->
  <circle cx="211" cy="294" r="8.5" fill="#0000ff" stroke="#1f2fe0" stroke-width="1.5"/>

  <!-- Misclassified blue pattern (inside red region) -->
  <circle cx="291" cy="197" r="10" fill="#fff" stroke="#1f2fe0" stroke-width="4.5"/>
  <circle cx="291" cy="197" r="3.5" fill="#fff" stroke="#1f2fe0" stroke-width="1.5"/>

  <!-- Misclassified red pattern (inside blue region) -->
  <circle cx="228" cy="343" r="10" fill="#fff" stroke="#e8141c" stroke-width="4.5"/>
  <circle cx="228" cy="343" r="3.5" fill="#fff" stroke="#e8141c" stroke-width="1.5"/>

  <!-- Callout arrows -->
  <line x1="457" y1="123" x2="307" y2="187" stroke="#000" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="462" y1="126" x2="241" y2="339" stroke="#000" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Callout text -->
  <g font-size="22" fill="#111" text-anchor="middle">
    <text x="491" y="67">Pattern erroneamente</text>
    <text x="491" y="105">classificati: ξ &gt; 0</text>
  </g>
</svg>
