<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 390" width="460" height="390" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="460" height="390" fill="#fff"/>

  <!-- Axes -->
  <line x1="75" y1="315" x2="75" y2="12" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="75" y1="315" x2="400" y2="315" stroke="#000" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="42" y="30" font-size="17">x<tspan font-size="11" dy="4">2</tspan></text>
  <text x="408" y="332" font-size="17">x<tspan font-size="11" dy="4">1</tspan></text>

  <!-- Hyperplane and margins -->
  <line x1="82" y1="344" x2="346" y2="64" stroke="#000" stroke-width="1.4"/>
  <line x1="45" y1="308" x2="326" y2="10" stroke="#000" stroke-width="1.2" stroke-dasharray="9 5"/>
  <line x1="141" y1="358" x2="374" y2="110" stroke="#000" stroke-width="1.2" stroke-dasharray="9 5"/>

  <!-- Line labels -->
  <g font-size="11" font-weight="bold" text-anchor="middle">
    <text transform="translate(201,126) rotate(-46.7)">w·x − b = 1</text>
    <text transform="translate(274,126) rotate(-46.7)">w·x − b = 0</text>
    <text transform="translate(352,150) rotate(-46.7)">w·x − b = −1</text>
  </g>

  <!-- Class +1 (filled) -->
  <g fill="#000">
    <circle cx="128" cy="91" r="7"/>
    <circle cx="153" cy="72" r="7"/>
    <circle cx="182" cy="81" r="7"/>
    <circle cx="198" cy="103" r="7"/>
    <circle cx="159" cy="110" r="7"/>
    <circle cx="129" cy="140" r="7"/>
    <circle cx="152" cy="156" r="7"/>
  </g>
  <!-- Support vector (+1) with halo -->
  <circle cx="195" cy="149" r="9" fill="#bbb"/>
  <circle cx="195" cy="149" r="5.5" fill="#000"/>

  <!-- Class -1 (hollow) -->
  <g fill="#fff" stroke="#000" stroke-width="1.4">
    <circle cx="316" cy="192" r="7"/>
    <circle cx="342" cy="224" r="7"/>
    <circle cx="314" cy="237" r="7"/>
    <circle cx="371" cy="240" r="7"/>
    <circle cx="266" cy="267" r="7"/>
    <circle cx="291" cy="277" r="7"/>
  </g>
  <!-- Support vectors (-1), bold outline -->
  <g fill="#fff" stroke="#000" stroke-width="3">
    <circle cx="282" cy="208" r="7"/>
    <circle cx="222" cy="272" r="7"/>
  </g>

  <!-- Vector w (perpendicular to the hyperplane) -->
  <line x1="192" y1="228" x2="154" y2="192" stroke="#000" stroke-width="1.3" marker-end="url(#ahs)"/>
  <text x="203" y="196" font-size="13" font-style="italic">w</text>

  <!-- Margin width 2/||w|| -->
  <line x1="298" y1="39" x2="374" y2="110" stroke="#000" stroke-width="1" stroke-dasharray="1.5 2.5" marker-start="url(#ahs)" marker-end="url(#ahs)"/>
  <g font-size="12" text-anchor="middle">
    <text x="352" y="48">2</text>
    <line x1="343" y1="52" x2="361" y2="52" stroke="#000" stroke-width="1"/>
    <text x="352" y="65">‖w‖</text>
  </g>

  <!-- Offset b/||w|| -->
  <line x1="75" y1="315" x2="94" y2="333" stroke="#000" stroke-width="1.3" marker-end="url(#ahs)"/>
  <g font-size="11" text-anchor="middle">
    <text x="48" y="340">b</text>
    <line x1="41" y1="344" x2="56" y2="344" stroke="#000" stroke-width="1"/>
    <text x="48" y="356">‖w‖</text>
  </g>
</svg>
