<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 600" width="850" height="600" font-family="'Times New Roman', Times, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="850" height="600" fill="#fff"/>

  <!-- Axes drawn behind the plane: x3 and x2 -->
  <line x1="202" y1="452" x2="200" y2="62" stroke="#111" stroke-width="1.4" marker-end="url(#ax)"/>
  <line x1="202" y1="452" x2="580" y2="410" stroke="#111" stroke-width="1.4" marker-end="url(#ax)"/>

  <!-- Hyperplane H -->
  <polygon points="108,120 278,88 498,421 376,517" fill="#cfcfcf" stroke="#222" stroke-width="1.3"/>

  <!-- x1 axis (in front) -->
  <line x1="202" y1="452" x2="443" y2="548" stroke="#111" stroke-width="1.4" marker-end="url(#ax)"/>

  <!-- Axis labels -->
  <g font-size="22" font-style="italic" fill="#111">
    <text x="193" y="38">x<tspan font-size="14" dy="5">3</tspan></text>
    <text x="590" y="420">x<tspan font-size="14" dy="5">2</tspan></text>
    <text x="448" y="558">x<tspan font-size="14" dy="5">1</tspan></text>
  </g>

  <!-- Line from origin to x: thick (front), dashed (behind plane), thin (front) -->
  <line x1="202" y1="452" x2="258" y2="345" stroke="#e8141c" stroke-width="3.5"/>
  <line x1="258" y1="345" x2="316" y2="234" stroke="#e8141c" stroke-width="1.5" stroke-dasharray="14 8"/>
  <line x1="316" y1="234" x2="381" y2="104" stroke="#e8141c" stroke-width="1.2"/>

  <!-- Projection x -> x_p and right-angle mark -->
  <line x1="381" y1="104" x2="253" y2="187" stroke="#e8141c" stroke-width="1.2"/>
  <polygon points="253,187 259.7,182.6 255.3,175.9 248.6,180.3" fill="none" stroke="#e8141c" stroke-width="1.2"/>

  <!-- Distance r dimension -->
  <line x1="238" y1="160" x2="360" y2="80" stroke="#000" stroke-width="1.6" marker-start="url(#as)" marker-end="url(#as)"/>
  <line x1="233" y1="152" x2="243" y2="168" stroke="#000" stroke-width="1.2"/>
  <line x1="355" y1="72" x2="365" y2="88" stroke="#000" stroke-width="1.2"/>
  <text x="299" y="108" font-size="18" font-style="italic">r</text>

  <!-- Point x and x_p labels -->
  <circle cx="381" cy="104" r="9" fill="#ff0000"/>
  <text x="394" y="102" font-size="24" font-weight="bold" font-style="italic" fill="#e8141c">x</text>
  <text x="264" y="208" font-size="20" font-weight="bold" font-style="italic" fill="#111">x<tspan font-size="13" dy="4">p</tspan></text>

  <!-- Region labels -->
  <text x="428" y="246" font-size="26" font-style="italic" fill="#111">ℛ<tspan font-size="15" dy="5">1</tspan></text>
  <text x="212" y="344" font-size="26" font-style="italic" fill="#e8141c">ℛ<tspan font-size="15" dy="5">2</tspan></text>

  <!-- Plane labels -->
  <text transform="translate(418,352) rotate(62)" font-size="22" font-style="italic" fill="#111">g(x) = 0</text>
  <text transform="translate(373,466) rotate(-35)" font-size="28" font-style="italic" fill="#111">H</text>

  <!-- Weight vector w -->
  <line x1="202" y1="452" x2="278" y2="422" stroke="#000" stroke-width="4.5" marker-end="url(#aw)"/>
  <text x="258" y="402" font-size="20" font-weight="bold" font-style="italic" fill="#000">w</text>

  <!-- Dashed line along w up to the plane, with end tick -->
  <line x1="281" y1="421" x2="368" y2="386" stroke="#000" stroke-width="1.3" stroke-dasharray="8 6" marker-end="url(#aw)"/>
  <line x1="368" y1="376" x2="376" y2="394" stroke="#000" stroke-width="1.3"/>

  <!-- Distance w0/||w|| -->
  <line x1="205" y1="500" x2="327" y2="452" stroke="#000" stroke-width="1.2" marker-start="url(#as)"/>
  <line x1="202" y1="493" x2="208" y2="507" stroke="#000" stroke-width="1.2"/>
  <line x1="324" y1="445" x2="330" y2="459" stroke="#000" stroke-width="1.2"/>
  <text transform="translate(236,507) rotate(-21.5)" font-size="17" font-style="italic" fill="#111">w<tspan font-size="11" dy="4">0</tspan><tspan dy="-4">/‖w‖</tspan></text>
</svg>
