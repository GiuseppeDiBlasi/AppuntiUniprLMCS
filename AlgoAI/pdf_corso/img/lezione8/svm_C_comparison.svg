<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 850 440" width="850" height="440" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Diagonal red -> white -> blue gradient, in panel-local coordinates -->
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="-34.5" y1="15" x2="368.5" y2="311">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>

    <!-- Symbols -->
    <g id="redSmall"><circle r="2.6" fill="#fff" fill-opacity="0.6" stroke="#000" stroke-width="0.9"/></g>
    <g id="redSV"><circle r="5.5" fill="none" stroke="#000" stroke-width="1"/><circle r="2.6" fill="none" stroke="#000" stroke-width="1"/></g>
    <g id="blueSV"><circle r="5.5" fill="none" stroke="#000" stroke-width="1"/><circle r="2.4" fill="#000"/></g>
    <g id="blueDot"><circle r="2.3" fill="#000"/></g>
    <g id="crossRing"><circle r="5.5" fill="none" stroke="#000" stroke-width="1"/><path d="M-3.5,-3.5L3.5,3.5M-3.5,3.5L3.5,-3.5" stroke="#000" stroke-width="1.2"/></g>
    <g id="cross"><path d="M-4,-4L4,4M-4,4L4,-4" stroke="#000" stroke-width="1.3" fill="none"/></g>
    <g id="crossBold"><path d="M-4.5,-4.5L4.5,4.5M-4.5,4.5L4.5,-4.5" stroke="#000" stroke-width="2.2" fill="none"/></g>
  </defs>

  <rect width="850" height="440" fill="#fff"/>

  <!-- Titles -->
  <g text-anchor="middle">
    <text x="222" y="28" font-size="22" font-family="'Cambria Math','Times New Roman',serif" fill="#e8141c"><tspan font-style="italic">C</tspan> = 10</text>
    <text x="214" y="62" font-size="20" fill="#111">2 errori, margine maggiore</text>
    <text x="624" y="28" font-size="22" font-family="'Cambria Math','Times New Roman',serif" fill="#e8141c"><tspan font-style="italic">C</tspan> = 200</text>
    <text x="627" y="62" font-size="20" fill="#111">1 solo errore, margine minore</text>
  </g>

  <!-- LEFT PANEL: C = 10 -->
  <g transform="translate(33,84)">
    <rect width="378" height="327" fill="url(#bg)" stroke="#000" stroke-width="1.5"/>

    <use xlink:href="#redSmall" x="110" y="39"/>
    <use xlink:href="#redSmall" x="94" y="76"/>
    <use xlink:href="#redSmall" x="159" y="64"/>
    <use xlink:href="#redSmall" x="124" y="114"/>
    <use xlink:href="#redSmall" x="89" y="137"/>
    <use xlink:href="#redSmall" x="49" y="180"/>

    <use xlink:href="#redSV" x="182" y="133"/>
    <use xlink:href="#redSV" x="137" y="175"/>
    <use xlink:href="#redSV" x="104" y="195"/>
    <use xlink:href="#crossRing" x="237" y="30"/>
    <use xlink:href="#crossRing" x="197" y="76"/>

    <use xlink:href="#blueSV" x="289" y="66"/>
    <use xlink:href="#blueSV" x="238" y="120"/>
    <use xlink:href="#blueSV" x="201" y="169"/>
    <use xlink:href="#blueSV" x="160" y="197"/>
    <use xlink:href="#blueSV" x="105" y="260"/>

    <use xlink:href="#blueDot" x="309" y="108"/>
    <use xlink:href="#blueDot" x="254" y="171"/>
    <use xlink:href="#blueDot" x="361" y="175"/>
    <use xlink:href="#blueDot" x="238" y="228"/>
    <use xlink:href="#blueDot" x="264" y="230"/>
    <use xlink:href="#blueDot" x="203" y="289"/>
    <use xlink:href="#blueDot" x="180" y="304"/>

    <use xlink:href="#crossBold" x="217" y="100"/>
    <use xlink:href="#cross" x="174" y="233"/>
  </g>

  <!-- RIGHT PANEL: C = 200 -->
  <g transform="translate(438,84)">
    <rect width="378" height="327" fill="url(#bg)" stroke="#000" stroke-width="1.5"/>

    <use xlink:href="#redSmall" x="100" y="39"/>
    <use xlink:href="#redSmall" x="84" y="76"/>
    <use xlink:href="#redSmall" x="149" y="64"/>
    <use xlink:href="#redSmall" x="114" y="114"/>
    <use xlink:href="#redSmall" x="79" y="137"/>
    <use xlink:href="#redSmall" x="39" y="180"/>
    <use xlink:href="#redSmall" x="187" y="76"/>
    <use xlink:href="#redSmall" x="227" y="30"/>

    <use xlink:href="#redSV" x="172" y="133"/>
    <use xlink:href="#redSV" x="127" y="175"/>
    <use xlink:href="#redSV" x="95" y="195"/>

    <use xlink:href="#blueSV" x="207" y="100"/>
    <use xlink:href="#blueSV" x="229" y="121"/>
    <use xlink:href="#blueSV" x="150" y="198"/>
    <use xlink:href="#blueSV" x="96" y="261"/>

    <use xlink:href="#blueDot" x="279" y="66"/>
    <use xlink:href="#blueDot" x="299" y="108"/>
    <use xlink:href="#blueDot" x="192" y="168"/>
    <use xlink:href="#blueDot" x="244" y="171"/>
    <use xlink:href="#blueDot" x="351" y="175"/>
    <use xlink:href="#blueDot" x="228" y="228"/>
    <use xlink:href="#blueDot" x="255" y="230"/>
    <use xlink:href="#blueDot" x="193" y="289"/>
    <use xlink:href="#blueDot" x="170" y="304"/>

    <use xlink:href="#cross" x="165" y="233"/>
  </g>
</svg>
