    <text x="693" y="387"><tspan font-style="italic">D</tspan>(<tspan font-weight="bold">x</tspan>) = −1</text>
    <text x="212" y="443"><tspan font-style="italic">D</tspan>(<tspan font-weight="bold">x</tspan>) &lt; −1</text>
