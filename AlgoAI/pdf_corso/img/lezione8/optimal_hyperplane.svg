<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 450" width="830" height="450" font-family="'Times New Roman', Times, serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <clipPath id="clip"><rect width="830" height="450"/></clipPath>
  </defs>

  <rect width="830" height="450" fill="#fff"/>

  <g clip-path="url(#clip)">
    <!-- Margin lines -->
    <line x1="172" y1="32.5" x2="722" y2="359" stroke="#8a8a8a" stroke-width="2"/>
    <line x1="55" y1="153" x2="520" y2="429" stroke="#8a8a8a" stroke-width="2"/>

    <!-- Optimal hyperplane -->
    <line x1="55" y1="58" x2="690" y2="435" stroke="#000" stroke-width="4"/>

    <!-- Class R1 (red) -->
    <circle cx="230" cy="67" r="14" fill="#ff0000"/>
    <g fill="#fbc4c4" stroke="#e86a6a" stroke-width="1.5">
      <circle cx="401" cy="106" r="12"/>
      <circle cx="511" cy="114" r="12"/>
      <circle cx="667" cy="268" r="12"/>
    </g>

    <!-- Class R2 (black / grey) -->
    <circle cx="95" cy="178" r="14" fill="#000"/>
    <circle cx="453" cy="391" r="14" fill="#000"/>
    <g fill="#b3b3b3" stroke="#888" stroke-width="1.5">
      <circle cx="128" cy="327" r="12"/>
      <circle cx="288" cy="370" r="12"/>
      <circle cx="90" cy="417" r="12"/>
      <circle cx="231" cy="442" r="12"/>
    </g>

    <!-- Margin arrows (perpendicular to the hyperplane) -->
    <g stroke="#000" stroke-width="2">
      <line x1="255" y1="177" x2="297" y2="107" marker-end="url(#ah)"/>
      <line x1="255" y1="177" x2="213" y2="247" marker-end="url(#ah)"/>
    </g>

    <!-- "maximum margin b" labels -->
    <g font-size="12" font-style="italic" text-anchor="middle" dominant-baseline="middle">
      <text transform="translate(268,137) rotate(-59.3)">maximum</text>
      <text transform="translate(284,147) rotate(-59.3)">margin b</text>
      <text transform="translate(226,208) rotate(-59.3)">maximum</text>
      <text transform="translate(242,217) rotate(-59.3)">margin b</text>
    </g>

    <!-- Region labels -->
    <text x="358" y="172" font-size="46" fill="#e8141c" font-style="italic">ℛ<tspan font-size="24" dy="8">1</tspan></text>
    <text x="298" y="326" font-size="46" fill="#222" font-style="italic">ℛ<tspan font-size="24" dy="8">2</tspan></text>

    <!-- Hyperplane label -->
    <text transform="translate(408,260) rotate(30.7)" font-size="36" font-style="italic" textLength="330" lengthAdjust="spacingAndGlyphs">optimal hyperplane</text>
  </g>
</svg>
