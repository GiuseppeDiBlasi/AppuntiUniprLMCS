<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" width="800" height="470" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="blk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>

  <rect width="800" height="470" fill="#fff"/>

  <!-- Linee nere -->
  <g stroke="#000" stroke-width="2.2" fill="none">
    <!-- dal box in alto verso sinistra e giù -->
    <path d="M568,76 H113 V408"/>
    <!-- riga centrale -->
    <path d="M113,240 H166" marker-end="url(#blk)"/>
    <path d="M246,240 H423" marker-end="url(#blk)"/>
    <!-- riga in basso -->
    <path d="M113,408 H166" marker-end="url(#blk)"/>
    <path d="M246,408 H423" marker-end="url(#blk)"/>
  </g>

  <!-- Frecce tratteggiate verso i blocchi di output -->
  <g stroke="#000" stroke-width="2.2" fill="none">
    <path d="M547,240 H585" stroke-dasharray="2 5" marker-end="url(#blk)"/>
    <path d="M547,408 H585" stroke-dasharray="2 5" marker-end="url(#blk)"/>
  </g>

  <!-- Frecce rosa -->
  <g fill="#e8105a">
    <!-- ogni freccia: asta (rect) + punta (polygon) -->
    <rect x="62.5" y="152" width="5" height="46"/>
    <polygon points="52,196 78,196 65,216"/>

    <rect x="62.5" y="320" width="5" height="46"/>
    <polygon points="52,364 78,364 65,384"/>

    <rect x="319.5" y="130" width="5" height="46"/>
    <polygon points="309,174 335,174 322,194"/>

    <rect x="319.5" y="306" width="5" height="46"/>
    <polygon points="309,350 335,350 322,370"/>
  </g>

  <!-- Box -->
  <g font-family="'Times New Roman', Times, serif" font-style="italic" fill="#555">
    <rect x="568" y="38" width="76" height="76" rx="12" fill="#96c4e0"/>
    <text x="606" y="87" font-size="30" text-anchor="middle">A</text>

    <rect x="168" y="202" width="76" height="76" rx="12" fill="#96c4e0"/>
    <text x="206" y="251" font-size="30" text-anchor="middle">A</text>

    <rect x="168" y="370" width="76" height="76" rx="12" fill="#96c4e0"/>
    <text x="206" y="419" font-size="30" text-anchor="middle">A</text>

    <rect x="425" y="202" width="114" height="76" rx="12" fill="#b5e8a6"/>
    <text x="456" y="250" font-size="28">A<tspan font-size="17" font-style="normal" dy="8" font-family="Arial, sans-serif">i&lt;50</tspan></text>

    <rect x="425" y="370" width="114" height="76" rx="12" fill="#f7a39c"/>
    <text x="456" y="418" font-size="28">A<tspan font-size="17" font-style="normal" dy="8" font-family="Arial, sans-serif">i≥50</tspan></text>
  </g>

  <!-- Etichette -->
  <g font-family="'Courier New', Courier, monospace" fill="#555">
    <text x="335" y="224" font-size="15" text-anchor="middle">filter(i &lt; 50)</text>
    <text x="335" y="392" font-size="15" text-anchor="middle">filter(i ≥ 50)</text>
    <text x="72" y="244" font-size="15" text-anchor="middle">copy</text>
    <text x="72" y="412" font-size="15" text-anchor="middle">copy</text>
  </g>

  <!-- Codice -->
  <g font-family="'Courier New', Courier, monospace" font-size="25" font-weight="bold">
    <text x="532" y="162"><tspan fill="#0033ff">if</tspan><tspan fill="#000"> (i &lt; 50)</tspan></text>
    <text x="532" y="331" fill="#0033ff">else</text>
    <text x="598" y="249" fill="#000">do_this(i);</text>
    <text x="598" y="417" fill="#000">do_that(i);</text>
  </g>
</svg>
