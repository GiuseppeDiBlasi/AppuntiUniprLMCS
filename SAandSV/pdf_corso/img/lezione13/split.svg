<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 720" width="460" height="720" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="460" height="720" fill="#fff"/>

  <!-- Box A in alto -->
  <rect x="163" y="10" width="80" height="80" rx="13" fill="#96c4e0"/>
  <text x="203" y="60" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="30" fill="#555" text-anchor="middle">A</text>

  <!-- Freccia verde -->
  <g stroke="#00b050" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M297,32 V90"/>
    <path d="M285,78 L297,92 L309,78"/>
  </g>

  <!-- Etichetta split -->
  <text x="222" y="128" font-family="'Courier New', Courier, monospace" font-size="15" fill="#555">split(i &lt; 50)</text>

  <!-- Linee nere dello split -->
  <g stroke="#000" stroke-width="2.4" fill="none">
    <path d="M203,90 V152"/>
    <path d="M140,152 H266"/>
    <path d="M140,152 V178"/>
    <path d="M266,152 V178"/>
  </g>
  <g fill="#000">
    <polygon points="132,176 148,176 140,194"/>
    <polygon points="258,176 274,176 266,194"/>
  </g>

  <!-- Box risultato -->
  <rect x="80" y="193" width="120" height="78" rx="13" fill="#b5e8a6"/>
  <rect x="206" y="193" width="120" height="78" rx="13" fill="#f7a39c"/>
  <g fill="#555">
    <text x="110" y="248" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="28">A<tspan font-size="17" font-style="normal" dy="8" font-family="Arial, sans-serif">i&lt;50</tspan></text>
    <text x="236" y="248" font-family="'Times New Roman', Times, serif" font-style="italic" font-size="28">A<tspan font-size="17" font-style="normal" dy="8" font-family="Arial, sans-serif">i≥50</tspan></text>
  </g>

  <!-- Linee puntinate -->
  <g stroke="#000" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="0.1 7">
    <path d="M74,233 H48 V508 H165"/>
    <path d="M266,284 V322 H83 V684 H165"/>
  </g>

  <!-- Punte delle frecce puntinate -->
  <g fill="#000">
    <polygon points="170,499 188,508 170,517"/>
    <polygon points="170,675 188,684 170,693"/>
  </g>

  <!-- Codice -->
  <g font-family="'Courier New', Courier, monospace" font-size="27" font-weight="bold">
    <text x="129" y="419"><tspan fill="#0033ff">if</tspan><tspan fill="#000"> (i &lt; 50)</tspan></text>
    <text x="129" y="600" fill="#0033ff">else</text>
    <text x="200" y="517" fill="#000">do_this(i);</text>
    <text x="200" y="693" fill="#000">do_that(i);</text>
  </g>
</svg>
