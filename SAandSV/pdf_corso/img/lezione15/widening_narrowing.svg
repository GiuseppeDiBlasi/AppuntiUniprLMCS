<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 0 700 520" width="700" height="520" font-family="'Latin Modern Math','STIX Two Math','Cambria Math','Times New Roman',serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#e03131"/>
    </marker>
    <marker id="arrBlue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#1c5fd4"/>
    </marker>
    <marker id="arrLeadBlue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#1c5fd4"/>
    </marker>
    <marker id="arrLeadRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#e03131"/>
    </marker>
  </defs>

  <!-- Cerchi -->
  <circle cx="260" cy="190" r="140" fill="none" stroke="#000" stroke-width="3.5"/>
  <circle cx="260" cy="300" r="140" fill="none" stroke="#000" stroke-width="3.5"/>

  <!-- Etichette top / bottom -->
  <text x="260" y="36" font-size="34" text-anchor="middle" font-style="italic">⊤</text>
  <text x="260" y="484" font-size="34" text-anchor="middle">⊥</text>

  <!-- Catena nera: zigzag da ⊥ -->
  <polyline points="260,430 249,419 271,408 249,397 271,386 260,375"
            fill="none" stroke="#000" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Tratteggio verso il punto fisso -->
  <line x1="260" y1="362" x2="260" y2="262" stroke="#000" stroke-width="4"
        stroke-dasharray="1 11" stroke-linecap="round"/>
  <!-- Punto fisso nell'intersezione -->
  <circle cx="260" cy="246" r="6" fill="#000"/>
  <text x="276" y="242" font-size="20" font-style="italic">fixpoint</text>

  <!-- Punto rosso in alto -->
  <circle cx="260" cy="100" r="6" fill="#e03131"/>

  <!-- Freccia rossa: widening (dallo zigzag al punto rosso) -->
  <path d="M246 400 C130 370 130 170 254 112" fill="none" stroke="#e03131"
        stroke-width="3" stroke-linecap="round" marker-end="url(#arrRed)"/>

  <!-- Freccia blu: narrowing (dal punto rosso alla catena nera) -->
  <path d="M268 108 C385 150 385 330 272 388" fill="none" stroke="#1c5fd4"
        stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrBlue)"/>

  <!-- Etichetta widening -->
  <text x="95" y="306" font-size="24" fill="#e03131" text-anchor="end">widening ∇</text>
  <line x1="102" y1="298" x2="154" y2="272" stroke="#e03131" stroke-width="2"
        marker-end="url(#arrLeadRed)"/>

  <!-- Etichetta narrowing -->
  <text x="432" y="138" font-size="24" fill="#1c5fd4">narrowing Δ</text>
  <line x1="426" y1="142" x2="340" y2="162" stroke="#1c5fd4" stroke-width="2"
        marker-end="url(#arrLeadBlue)"/>

</svg>
