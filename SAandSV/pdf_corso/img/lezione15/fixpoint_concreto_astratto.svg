<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 390" width="860" height="390" font-family="'Latin Modern Math','STIX Two Math','Cambria Math','Times New Roman',serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#e03131"/>
    </marker>
    <marker id="arrBlue" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 z" fill="#1c5fd4"/>
    </marker>
  </defs>

  <!-- ===== Dominio concreto C ===== -->
  <text x="120" y="62" font-size="34" font-style="italic" text-anchor="middle">C</text>
  <text x="22" y="190" font-size="38" font-style="italic">F</text>

  <circle cx="120" cy="170" r="60" fill="none" stroke="#000" stroke-width="3"/>
  <circle cx="125" cy="270" r="58" fill="none" stroke="#000" stroke-width="3"/>
  <text x="120" y="98" font-size="26" text-anchor="middle">⊤</text>
  <text x="125" y="362" font-size="26" text-anchor="middle">⊥</text>

  <!-- punto rosso (post-fixpoint) -->
  <circle cx="120" cy="170" r="5" fill="#e03131"/>
  <path d="M124 163 C140 130 160 112 180 100" fill="none" stroke="#e03131" stroke-width="2.5"
        stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="196" y="106" font-size="26" fill="#e03131">post fixpoint</text>

  <!-- fixpoint (lente di intersezione) -->
  <g stroke="#1c5fd4" stroke-width="2.5" stroke-linecap="round">
    <line x1="106" y1="228" x2="112" y2="214"/>
    <line x1="115" y1="228" x2="121" y2="214"/>
    <line x1="124" y1="228" x2="130" y2="214"/>
    <line x1="133" y1="228" x2="139" y2="214"/>
  </g>
  <circle cx="123" cy="229" r="3.5" fill="#000"/>
  <text x="123" y="258" font-size="20" text-anchor="middle">lfp</text>
  <line x1="228" y1="222" x2="146" y2="222" stroke="#1c5fd4" stroke-width="2"
        marker-end="url(#arrBlue)"/>
  <text x="238" y="230" font-size="26" fill="#1c5fd4">fixpoint</text>

  <!-- ===== Dominio astratto A ===== -->
  <text x="700" y="62" font-size="34" font-style="italic" text-anchor="middle">A</text>
  <text x="788" y="240" font-size="38" font-style="italic">F<tspan dy="-14" font-size="24">#</tspan></text>

  <circle cx="700" cy="150" r="45" fill="none" stroke="#000" stroke-width="3"/>
  <circle cx="700" cy="242" r="66" fill="none" stroke="#000" stroke-width="3"/>
  <text x="700" y="96" font-size="26" text-anchor="middle">⊤</text>
  <text x="700" y="334" font-size="26" text-anchor="middle">⊥</text>

  <circle cx="700" cy="196" r="3.5" fill="#000"/>
  <circle cx="700" cy="187" r="4" fill="#e03131"/>
  <text x="700" y="224" font-size="20" text-anchor="middle">lfp</text>

  <!-- ===== Freccia γ: dall'astratto al concreto ===== -->
  <path d="M696 184 C560 136 300 136 134 168" fill="none" stroke="#e03131" stroke-width="2.5"
        stroke-linecap="round" marker-end="url(#arrRed)"/>
  <text x="440" y="124" font-size="30" font-style="italic" fill="#e03131" text-anchor="middle">γ</text>
</svg>
