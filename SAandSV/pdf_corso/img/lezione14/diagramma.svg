<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 260" width="1280" height="260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L10,5 L0,9 Z" fill="#4a5560"/>
    </marker>
  </defs>
  <rect width="1280" height="260" fill="#ffffff"/>

  <g font-family="Lato, Calibri, 'Segoe UI', Arial, sans-serif" font-size="44" font-style="italic" fill="#555b66">
    <!-- Left box -->
    <rect x="8" y="40" width="335" height="156" fill="#fff" stroke="#F4A12B" stroke-width="4"/>
    <text x="40" y="106">expr ↝ [1, 12]</text>
    <text x="40" y="176">y ↝ [−∞, +∞]</text>

    <!-- Arrow 1 -->
    <line x1="370" y1="111" x2="487" y2="111" stroke="#4a5560" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Middle box -->
    <rect x="507" y="78" width="270" height="66" fill="#fff" stroke="#2C86C8" stroke-width="4"/>
    <text x="517" y="127">x = y + expr</text>

    <!-- Arrow 2 -->
    <line x1="781" y1="111" x2="900" y2="111" stroke="#4a5560" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Right box -->
    <rect x="912" y="4" width="340" height="236" fill="#fff" stroke="#F4A12B" stroke-width="4"/>
    <text x="946" y="66">expr ↝ [1, 12]</text>
    <text x="946" y="141">y ↝ [−∞, +∞]</text>
    <text x="946" y="218">x ↝ [−∞, +∞]</text>
  </g>
</svg>
