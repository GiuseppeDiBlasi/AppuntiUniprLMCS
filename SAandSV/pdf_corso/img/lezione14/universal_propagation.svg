<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 160 1416 520" width="1416" height="520" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L11,6 L0,11 Z" fill="#111"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <style>
      .m  { font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", "Times New Roman", serif; fill: #111; }
      .big { font-size: 36px; }
      .ann { font-size: 25px; }
      .lbl { font-size: 30px; }
      .v  { font-style: italic; }
      .s  { font-size: 17px; }
      .red { fill: #e8000d; }
      .box { fill: #fff; stroke: #111; stroke-width: 2; filter: url(#sh); }
      .gray { font-family: Lato, Calibri, "Segoe UI", Arial, sans-serif; fill: #5b6b7a; font-size: 26px; }
      .edge { stroke: #111; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
    </style>
  </defs>
  <rect x="0" y="160" width="1416" height="520" fill="#fff"/>

  <!-- ================= LEFT: CFG ================= -->
  <g class="m lbl" text-anchor="middle">
    <text x="333" y="205">b0</text>
    <text x="181" y="322">b1</text>
    <text x="487" y="322">b2</text>
    <text x="333" y="544">b3</text>
  </g>

  <rect class="box" x="267" y="222" width="133" height="44" rx="10"/>
  <rect class="box" x="127" y="334" width="187" height="148" rx="12"/>
  <rect class="box" x="354" y="334" width="186" height="148" rx="12"/>
  <rect class="box" x="234" y="558" width="200" height="50" rx="10"/>

  <g class="m big" text-anchor="middle">
    <text x="333" y="258"><tspan class="v">x</tspan> ← 0</text>

    <text x="220" y="380">(<tspan class="v">y</tspan> &lt; 0)</text>
    <text x="220" y="422"><tspan class="v">x</tspan> ← <tspan class="v">x</tspan> + 1</text>
    <text x="220" y="465"><tspan class="v">y</tspan> ← <tspan class="v">y</tspan> + 1</text>

    <text x="447" y="380">(<tspan class="v">y</tspan> ≥ 0)</text>
    <text x="447" y="422"><tspan class="v">x</tspan> ← <tspan class="v">x</tspan> − 1</text>
    <text x="447" y="465"><tspan class="v">y</tspan> ← <tspan class="v">z</tspan> ∗ 2</text>

    <text x="334" y="595"><tspan class="v">x</tspan> ← <tspan class="v">x</tspan> + <tspan class="v">y</tspan></text>
  </g>
  <text class="gray" x="344" y="640" text-anchor="middle">CFG</text>

  <line class="edge" x1="302" y1="268" x2="224" y2="331"/>
  <line class="edge" x1="366" y1="268" x2="442" y2="331"/>
  <line class="edge" x1="258" y1="484" x2="302" y2="554"/>
  <line class="edge" x1="440" y1="484" x2="366" y2="554"/>

  <g class="m ann">
    <text x="410" y="279">LU<tspan class="s" dy="7">post</tspan><tspan dy="-7">(b0) = {<tspan class="v">y</tspan>, <tspan class="v">z</tspan>}</tspan></text>

    <text x="18" y="521">LU<tspan class="s" dy="7">post</tspan><tspan dy="-7">(b1) = {<tspan class="v">z</tspan>}</tspan></text>

    <text x="452" y="516">LU<tspan class="s" dy="7">post</tspan><tspan dy="-7">(b2) = {<tspan class="v">y</tspan>, <tspan class="v">z</tspan>}</tspan></text>

    <text x="452" y="568">LU<tspan class="s" dy="7">pre</tspan><tspan dy="-7">(b3)</tspan><tspan class="s" dy="-9">∀</tspan><tspan dy="9"> = LU</tspan><tspan class="s" dy="7">post</tspan><tspan dy="-7">(b1) ∩ LU</tspan><tspan class="s" dy="7">post</tspan><tspan dy="-7">(b2) = {<tspan class="v">z</tspan>}</tspan></text>

    <text x="452" y="637">LU<tspan class="s" dy="7">post</tspan><tspan dy="-7">(b3)</tspan><tspan class="s" dy="-9">∀</tspan><tspan dy="9"> = {<tspan class="v">z</tspan>}</tspan></text>
  </g>

  <!-- ================= MIDDLE: BIG ARROW ================= -->
  <polygon points="594,366 890,366 890,337 947,398 890,460 890,430 594,430"
           fill="#1f7ab8" stroke="#16507a" stroke-width="2.5"/>
  <g font-family="Lato, Calibri, 'Segoe UI', Arial, sans-serif" font-size="25" fill="#fff" text-anchor="middle">
    <text x="755" y="392">Program</text>
    <text x="755" y="423">Transformation</text>
  </g>

  <!-- ================= RIGHT: TRANSFORMED ================= -->
  <g class="m lbl" text-anchor="middle">
    <text x="1190" y="188">b0</text>
    <text x="1038" y="308">b1</text>
    <text x="1344" y="308">b2</text>
    <text x="1190" y="530">b3</text>
  </g>

  <rect class="box" x="1125" y="203" width="133" height="44" rx="10"/>
  <rect class="box" x="985" y="322" width="187" height="146" rx="12"/>
  <rect class="box" x="1211" y="322" width="186" height="146" rx="12"/>
  <rect class="box" x="1100" y="540" width="200" height="50" rx="10"/>

  <g class="m big" text-anchor="middle">
    <text x="1191" y="238"><tspan class="v">x</tspan> ← 0</text>

    <text x="1078" y="367">(<tspan class="v">y</tspan> &lt; 0)</text>
    <text x="1078" y="410"><tspan class="v">x</tspan> ← <tspan class="v">x</tspan> + 1</text>
    <text x="1078" y="453"><tspan class="v">y</tspan> ← <tspan class="v">y</tspan> + 1</text>

    <text x="1304" y="367">(<tspan class="v">y</tspan> ≥ 0)</text>
    <text x="1304" y="410"><tspan class="v">x</tspan> ← <tspan class="v">x</tspan> − 1</text>
    <text class="red" x="1304" y="453"><tspan class="v">y</tspan> ← ?</text>

    <text x="1200" y="578"><tspan class="v">x</tspan> ← <tspan class="v">x</tspan> + <tspan class="v">y</tspan></text>
  </g>

  <line class="edge" x1="1162" y1="250" x2="1085" y2="319"/>
  <line class="edge" x1="1220" y1="250" x2="1296" y2="319"/>
  <line class="edge" x1="1085" y1="470" x2="1150" y2="537"/>
  <line class="edge" x1="1300" y1="470" x2="1230" y2="537"/>

  <text class="gray" x="1200" y="640" text-anchor="middle">Universal Propagation</text>
</svg>
