<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1410 490" width="1410" height="490" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L11,6 L0,11 Z" fill="#111"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <style>
      .m   { font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", "Times New Roman", serif; fill: #111; }
      .big { font-size: 36px; }
      .lbl { font-size: 30px; }
      .v   { font-style: italic; }
      .red { fill: #e8000d; }
      .box { fill: #fff; stroke: #111; stroke-width: 2; filter: url(#sh); }
      .gray { font-family: Lato, Calibri, "Segoe UI", Arial, sans-serif; fill: #5b6b7a; font-size: 26px; }
      .edge { stroke: #111; stroke-width: 1.8; fill: none; marker-end: url(#ah); }
    </style>
  </defs>
  <rect width="1410" height="490" fill="#fff"/>

  <!-- ===================== 1) CFG ===================== -->
  <g transform="translate(217,0)">
    <g class="m lbl" text-anchor="middle">
      <text x="0" y="22">b0</text>
      <text x="-153" y="137">b1</text>
      <text x="151" y="137">b2</text>
      <text x="0" y="359">b3</text>
    </g>
    <rect class="box" x="-67" y="38" width="134" height="44" rx="10"/>
    <rect class="box" x="-209" y="150" width="197" height="150" rx="12"/>
    <rect class="box" x="-19" y="150" width="197" height="150" rx="12"/>
    <rect class="box" x="-100" y="372" width="200" height="52" rx="10"/>
    <g class="m big" text-anchor="middle">
      <text x="0" y="72"><tspan class="v">x</tspan> ← 0</text>
      <text x="-111" y="192">(<tspan class="v">y</tspan> &lt; 0)</text>
      <text x="-111" y="235"><tspan class="v">x</tspan> ← <tspan class="v">x</tspan> + 1</text>
      <text x="-111" y="278"><tspan class="v">y</tspan> ← <tspan class="v">y</tspan> + 1</text>
      <text x="80" y="192">(<tspan class="v">y</tspan> ≥ 0)</text>
      <text x="80" y="235"><tspan class="v">x</tspan> ← <tspan class="v">x</tspan> − 1</text>
      <text x="80" y="278"><tspan class="v">y</tspan> ← <tspan class="v">z</tspan> ∗ 2</text>
      <text x="0" y="410"><tspan class="v">x</tspan> ← <tspan class="v">x</tspan> + <tspan class="v">y</tspan></text>
    </g>
    <line class="edge" x1="-30" y1="84" x2="-103" y2="147"/>
    <line class="edge" x1="30" y1="84" x2="103" y2="147"/>
    <line class="edge" x1="-110" y1="302" x2="-30" y2="369"/>
    <line class="edge" x1="110" y1="302" x2="30" y2="369"/>
  </g>
  <text class="gray" x="209" y="478" text-anchor="middle">CFG</text>

  <!-- ===================== 2) Existential Propagation ===================== -->
  <g transform="translate(700,0)">
    <g class="m lbl" text-anchor="middle">
      <text x="0" y="22">b0</text>
      <text x="-153" y="137">b1</text>
      <text x="151" y="137">b2</text>
      <text x="0" y="359">b3</text>
    </g>
    <rect class="box" x="-67" y="38" width="134" height="44" rx="10"/>
    <rect class="box" x="-206" y="158" width="186" height="142" rx="12"/>
    <rect class="box" x="20" y="158" width="186" height="142" rx="12"/>
    <rect class="box" x="-67" y="372" width="134" height="52" rx="10"/>
    <g class="m big" text-anchor="middle">
      <text x="0" y="72"><tspan class="v">x</tspan> ← 0</text>
      <text x="-113" y="198">(<tspan class="v">y</tspan> &lt; 0)</text>
      <text x="-113" y="241"><tspan class="v">x</tspan> ← <tspan class="v">x</tspan> + 1</text>
      <text x="-113" y="284"><tspan class="v">y</tspan> ← <tspan class="v">y</tspan> + 1</text>
      <text x="113" y="198">(<tspan class="v">y</tspan> ≥ 0)</text>
      <text x="113" y="241"><tspan class="v">x</tspan> ← <tspan class="v">x</tspan> − 1</text>
      <text class="red" x="113" y="284"><tspan class="v">y</tspan> ← ?</text>
      <text class="red" x="0" y="410"><tspan class="v">x</tspan> ← ?</text>
    </g>
    <line class="edge" x1="-30" y1="84" x2="-103" y2="155"/>
    <line class="edge" x1="30" y1="84" x2="103" y2="155"/>
    <line class="edge" x1="-110" y1="302" x2="-30" y2="369"/>
    <line class="edge" x1="110" y1="302" x2="30" y2="369"/>
  </g>
  <text class="gray" x="712" y="478" text-anchor="middle">Existential Propagation</text>

  <!-- ===================== 3) Universal Propagation ===================== -->
  <g transform="translate(1174,0)">
    <g class="m lbl" text-anchor="middle">
      <text x="0" y="22">b0</text>
      <text x="-153" y="137">b1</text>
      <text x="151" y="137">b2</text>
      <text x="0" y="359">b3</text>
    </g>
    <rect class="box" x="-67" y="38" width="134" height="44" rx="10"/>
    <rect class="box" x="-205" y="158" width="186" height="142" rx="12"/>
    <rect class="box" x="19" y="158" width="186" height="142" rx="12"/>
    <rect class="box" x="-100" y="372" width="200" height="52" rx="10"/>
    <g class="m big" text-anchor="middle">
      <text x="0" y="72"><tspan class="v">x</tspan> ← 0</text>
      <text x="-112" y="198">(<tspan class="v">y</tspan> &lt; 0)</text>
      <text x="-112" y="241"><tspan class="v">x</tspan> ← <tspan class="v">x</tspan> + 1</text>
      <text x="-112" y="284"><tspan class="v">y</tspan> ← <tspan class="v">y</tspan> + 1</text>
      <text x="112" y="198">(<tspan class="v">y</tspan> ≥ 0)</text>
      <text x="112" y="241"><tspan class="v">x</tspan> ← <tspan class="v">x</tspan> − 1</text>
      <text class="red" x="112" y="284"><tspan class="v">y</tspan> ← ?</text>
      <text x="0" y="410"><tspan class="v">x</tspan> ← <tspan class="v">x</tspan> + <tspan class="v">y</tspan></text>
    </g>
    <line class="edge" x1="-30" y1="84" x2="-103" y2="155"/>
    <line class="edge" x1="30" y1="84" x2="103" y2="155"/>
    <line class="edge" x1="-110" y1="302" x2="-30" y2="369"/>
    <line class="edge" x1="110" y1="302" x2="30" y2="369"/>
  </g>
  <text class="gray" x="1183" y="478" text-anchor="middle">Universal Propagation</text>
</svg>
