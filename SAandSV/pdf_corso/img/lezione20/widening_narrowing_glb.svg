<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 900" width="740" height="900" font-family="'Gill Sans', 'Gill Sans MT', Optima, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="clipBlue"><ellipse cx="333" cy="335" rx="195" ry="220"/></clipPath>
    <marker id="aBlue" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8230f"/>
    </marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f9a52"/>
    </marker>
    <marker id="aYellow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#f0a800"/>
    </marker>
  </defs>
  <rect width="740" height="900" fill="#fff"/>

  <!-- ellipses -->
  <ellipse cx="333" cy="335" rx="195" ry="220" fill="#cce9fd"/>
  <ellipse cx="333" cy="668" rx="195" ry="220" fill="#b9e6b9"/>
  <ellipse cx="333" cy="668" rx="195" ry="220" fill="#96d6c2" clip-path="url(#clipBlue)"/>

  <!-- widening (blue) -->
  <path d="M318 800 C 190 720, 160 450, 245 320" fill="none" stroke="#e8230f" stroke-width="5" stroke-linecap="round" marker-end="url(#aBlue)"/>

  <!-- narrowing (green): approaches lfp, does not reach it -->
  <path d="M250 315 C 385 332, 415 430, 346 512" fill="none" stroke="#1f9a52" stroke-width="4.5" stroke-linecap="round" marker-end="url(#aGreen)"/>

  <!-- F^glb (yellow): approaches lfp from above, does not reach it -->
  <path d="M250 318 C 257 355, 270 392, 288 426" fill="none" stroke="#f0a800" stroke-width="4.5" stroke-linecap="round" marker-end="url(#aYellow)"/>

  <!-- lfp point -->
  <circle cx="333" cy="553" r="10" fill="#000"/>

  <!-- labels -->
  <g fill="#000" font-size="30">
    <text x="390" y="290">postfp(f)</text>
    <text x="362" y="515">fp(f)</text>
    <text x="304" y="599">lfp(f)</text>
  </g>
  <text x="76" y="648" font-size="23" fill="#e8230f">Widening</text>
  <text x="436" y="378" font-size="23" fill="#1f9a52">Narrowing</text>
  <text x="436" y="418" font-size="23" fill="#d99200">F<tspan dy="-9" font-size="16">⊓</tspan><tspan dy="9"> (glb)</tspan></text>
</svg>
