<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 1060" width="1110" height="1060" font-family="'Gill Sans', 'Gill Sans MT', Optima, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="clipBlue"><ellipse cx="322" cy="330" rx="234" ry="265"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#e8230f"/>
    </marker>
  </defs>
  <rect width="1110" height="1060" fill="#fff"/>

  <!-- ellipses -->
  <ellipse cx="322" cy="330" rx="234" ry="265" fill="#cce9fd"/>
  <ellipse cx="322" cy="728" rx="234" ry="265" fill="#b9e6b9"/>
  <ellipse cx="322" cy="728" rx="234" ry="265" fill="#96d6c2" clip-path="url(#clipBlue)"/>

  <!-- top (⊤) -->
  <line x1="322" y1="18" x2="322" y2="68" stroke="#000" stroke-width="3"/>
  <line x1="304" y1="18" x2="340" y2="18" stroke="#000" stroke-width="3"/>
  <circle cx="322" cy="68" r="12"/>

  <!-- bottom (⊥) -->
  <line x1="317" y1="993" x2="317" y2="1045" stroke="#000" stroke-width="3"/>
  <line x1="299" y1="1045" x2="335" y2="1045" stroke="#000" stroke-width="3"/>
  <circle cx="317" cy="993" r="12"/>

  <!-- lfp point -->
  <circle cx="322" cy="592" r="12"/>

  <!-- labels -->
  <g font-size="38" fill="#000">
    <text x="390" y="278">postfp(f)</text>
    <text x="357" y="542">fp(f)</text>
    <text x="288" y="645">lfp(f)</text>
    <text x="398" y="852">prefp(f)</text>
  </g>

  <!-- spring + widening jump -->
  <path d="M312 985 H300 A16 16 0 0 1 300 953 H312
           M312 953 H300 A16 16 0 0 1 300 921 H312
           M312 921 H300 A16 16 0 0 1 300 889 H312"
        fill="none" stroke="#e8230f" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M303 888 C 165 765, 118 560, 212 312" fill="none" stroke="#e8230f" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="92" y="915" font-size="36" fill="#e8230f">Widening!</text>

  <!-- side text -->
  <g font-size="35" fill="#000" text-anchor="middle">
    <text x="875" y="502">Widening: over-approximates</text>
    <text x="875" y="545">the lfp(f)</text>
    <text x="875" y="584">but guarantees convergence</text>
  </g>
</svg>
