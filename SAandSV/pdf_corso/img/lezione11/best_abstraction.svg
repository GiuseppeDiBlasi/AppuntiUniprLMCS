  <!-- quadrato circoscritto -->
  <rect x="249" y="252" width="145" height="145" fill="none" stroke="#000" stroke-width="1.5"/>

  <!-- assi -->
  <line x1="87" y1="324" x2="555" y2="324" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="321" y1="525" x2="321" y2="122" stroke="#000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="588" y="340" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold">x</text>
  <text x="333" y="128" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="bold">y</text>

