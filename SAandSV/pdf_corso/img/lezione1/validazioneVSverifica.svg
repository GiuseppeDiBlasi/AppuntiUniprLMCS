<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 210" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1c3545" />
    </marker>
  </defs>

  <!-- RETTANGOLO VERDE: Validazione (include interamente la nuvola e le specifiche SW) -->
  <rect x="35" y="28" width="515" height="168" fill="none" stroke="#2e7d32" stroke-width="2.5" rx="4" />
  <text x="45" y="20" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2e7d32">Validazione</text>

  <!-- RETTANGOLO ROSSO: Verifica (include specifiche SW e sistema) -->
  <rect x="390" y="48" width="455" height="148" fill="none" stroke="#d32f2f" stroke-width="2.5" rx="4" />
  <text x="845" y="40" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#d32f2f" text-anchor="end">Verifica</text>

  <!-- Nuvola: Requisiti raccolti (informali) -->
  <g id="nuvola-requisiti">
    <path d="M 95 160 C 65 160, 50 133, 65 110 C 55 83, 90 65, 125 74 C 145 51, 200 51, 225 74 C 250 60, 280 83, 270 110 C 290 133, 270 160, 240 160 Z" 
          fill="#cbe5f8" stroke="#1a364a" stroke-width="1.8" stroke-linejoin="round" />
    <text x="168" y="110" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1a364a" text-anchor="middle">Requisiti raccolti</text>
    <text x="168" y="130" font-family="Arial, sans-serif" font-size="14" fill="#1a364a" text-anchor="middle">(informali)</text>
  </g>

  <!-- Freccia 1 -->
  <path d="M 285 125 L 360 125" stroke="#1c3545" stroke-width="3.5" marker-end="url(#arrow)" />

  <!-- Specifiche SW -->
  <g id="specifiche-sw">
    <rect x="410" y="78" width="105" height="70" fill="#ffffff" stroke="#1c3545" stroke-width="1.2" />
    <rect x="416" y="81" width="105" height="70" fill="#ffffff" stroke="#1c3545" stroke-width="1.2" />
    <rect x="422" y="84" width="105" height="70" fill="#ffffff" stroke="#1c3545" stroke-width="1.2" />
    <rect x="428" y="87" width="105" height="70" fill="#ffffff" stroke="#1c3545" stroke-width="1.2" />
    <rect x="434" y="90" width="105" height="70" fill="#ffffff" stroke="#1c3545" stroke-width="1.2" />
    <rect x="440" y="93" width="105" height="70" fill="#ffffff" stroke="#1c3545" stroke-width="1.2" />
    <rect x="446" y="96" width="105" height="70" fill="#dceefa" stroke="#1c3545" stroke-width="1.5" />
    <text x="498" y="137" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#1c3545" text-anchor="middle">Specifiche SW</text>
  </g>

  <!-- Freccia 2 -->
  <path d="M 560 131 L 635 131" stroke="#000000" stroke-width="3.5" marker-end="url(#arrow)" />

  <!-- Box 3D: Sistema -->
  <g id="sistema-box">
    <polygon points="660,105 700,82 800,82 760,105" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <polygon points="760,105 800,82 800,137 760,160" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <rect x="660" y="105" width="100" height="55" fill="#ffffff" stroke="#000000" stroke-width="1.5" />
    <text x="710" y="139" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">Sistema</text>
  </g>
</svg>
