<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%">
  <defs>
    <!-- Definizione per la punta della freccia -->
    <marker id="arrowhead" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000" />
    </marker>
  </defs>

  <!-- Simbolo P -->
  <text x="130" y="115" font-family="'Times New Roman', Times, Georgia, serif" font-size="64" font-style="italic" text-anchor="middle" fill="#000000">P</text>

  <!-- Freccia da P ad Analizzatore dinamico -->
  <path d="M 180 90 L 330 90" stroke="#000000" stroke-width="1.8" marker-end="url(#arrowhead)" />

  <!-- Box Analizzatore dinamico -->
  <rect x="350" y="30" width="220" height="120" fill="#ffffff" stroke="#000000" stroke-width="1.8" />
  <text x="460" y="82" font-family="Arial, sans-serif" font-size="18" fill="#000000" text-anchor="middle">Analizzatore</text>
  <text x="460" y="106" font-family="Arial, sans-serif" font-size="18" fill="#000000" text-anchor="middle">dinamico</text>

  <!-- Freccia da Analizzatore a Sì/No -->
  <path d="M 590 90 L 730 90" stroke="#000000" stroke-width="1.8" marker-end="url(#arrowhead)" />

  <!-- Output Sì / No -->
  <text x="760" y="80" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#32cd32">Sì</text>
  <text x="760" y="110" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#dd0000">No</text>

  <!-- Sezione inferiore: frecce e numeri sotto P -->
  <g id="sequenza-input">
    <!-- Frecce verticali verso l'alto -->
    <path d="M 55 210 L 55 165" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <path d="M 80 210 L 80 165" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <path d="M 105 210 L 105 165" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <path d="M 130 210 L 130 165" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)" />
    <path d="M 155 210 L 155 165" stroke="#000000" stroke-width="1.5" marker-end="url(#arrowhead)" />

    <!-- Rettangolo arrotondato verde attorno ai numeri 1, 2, 3 -->
    <rect x="68" y="218" width="74" height="30" rx="12" fill="none" stroke="#32cd32" stroke-width="2.2" />

    <!-- Numeri della sequenza -->
    <text x="55" y="240" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#000000">0</text>
    <text x="80" y="240" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#000000">1</text>
    <text x="105" y="240" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#000000">2</text>
    <text x="130" y="240" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#000000">3</text>
    <text x="155" y="240" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#000000">4</text>
    <text x="185" y="240" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#000000">...</text>
  </g>
</svg>
