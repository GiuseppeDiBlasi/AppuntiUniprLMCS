<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2040 1000" width="2040" height="1000" font-family="Calibri, 'Segoe UI', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
