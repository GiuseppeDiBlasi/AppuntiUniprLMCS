<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2140 1050" width="2140" height="1050" font-family="Calibri, 'Segoe UI', Arial, sans-serif" font-size="46" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
    <g id="star" stroke-linecap="round" stroke-width="5">
      <line x1="0" y1="-18" x2="0" y2="18"/>
      <line x1="-18" y1="0" x2="18" y2="0"/>
      <line x1="-13" y1="-13" x2="13" y2="13"/>
      <line x1="-13" y1="13" x2="13" y2="-13"/>
    </g>
  </defs>

  <rect width="2140" height="1050" fill="#fff"/>

  <!-- Top labels -->
  <g text-anchor="middle" fill="#000">
    <text x="763" y="73">configuration,</text>
    <text x="763" y="139">components</text>
    <text x="1810" y="73">analysis dump,</text>
    <text x="1810" y="139">warnings</text>
  </g>
  <line x1="774" y1="186" x2="774" y2="224" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1818" y1="228" x2="1818" y2="190" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- LiSA frame -->
  <rect x="488" y="230" width="1615" height="766" rx="18" fill="none" stroke="#000" stroke-width="5"/>
  <text x="503" y="268" fill="#000">LiSA</text>

  <!-- Pi (stacked) -->
  <g fill="#fff" stroke="#000" stroke-width="2.5">
    <rect x="154" y="171" width="218" height="87"/>
    <rect x="145" y="162" width="218" height="87"/>
    <rect x="136" y="153" width="218" height="87"/>
  </g>
  <text x="221" y="214" fill="#000">P<tspan dy="-14" font-size="32" font-style="italic">i</tspan></text>

  <line x1="245" y1="240" x2="245" y2="326" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Li Frontend (stacked, blue) -->
  <g fill="#fff" stroke="#0070C0" stroke-width="3.5">
    <rect x="88" y="349" width="350" height="148" rx="18"/>
    <rect x="79" y="340" width="350" height="148" rx="18"/>
    <rect x="70" y="331" width="350" height="148" rx="18"/>
  </g>
  <text x="112" y="423" fill="#000" font-family="Cambria, 'Times New Roman', serif">L<tspan dy="-14" font-size="32" font-style="italic">i</tspan><tspan dy="14" font-family="Calibri, 'Segoe UI', Arial, sans-serif" dx="12">Frontend</tspan></text>

  <line x1="245" y1="480" x2="245" y2="566" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- CFGs (stacked) -->
  <g fill="#fff" stroke="#000" stroke-width="2.5">
    <rect x="154" y="588" width="218" height="87"/>
    <rect x="145" y="579" width="218" height="87"/>
    <rect x="136" y="570" width="218" height="87"/>
  </g>
  <text x="235" y="627" text-anchor="middle" fill="#000">CFGs</text>

  <!-- Connection CFGs -> LiSA -> Interprocedural / Checks -->
  <line x1="372" y1="613" x2="484" y2="613" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <polyline points="484,613 529,613 529,349 1638,349" fill="none" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="529" y1="613" x2="529" y2="733" stroke="#000" stroke-width="2.5"/>
  <line x1="529" y1="733" x2="573" y2="733" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="774" y1="349" x2="774" y2="571" stroke="#000" stroke-width="2.5"/>

  <!-- Checks -->
  <rect x="1643" y="276" width="349" height="148" rx="14" fill="#fff" stroke="#0E9B52" stroke-width="3.5"/>
  <text x="1818" y="361" text-anchor="middle" fill="#000">Checks</text>

  <!-- Interprocedural Analysis -->
  <rect x="578" y="571" width="392" height="323" rx="14" fill="#fff" stroke="#0E9B52" stroke-width="3.5"/>
  <text x="762" y="617" text-anchor="middle" fill="#000">Interprocedural</text>
  <text x="767" y="683" text-anchor="middle" fill="#000">Analysis</text>
  <rect x="599" y="729" width="349" height="148" rx="14" fill="#fff" stroke="#0E9B52" stroke-width="3.5"/>
  <text x="766" y="803" text-anchor="middle" fill="#000">Call Graph</text>

  <!-- CFG fixpoint -->
  <rect x="1122" y="521" width="348" height="148" rx="14" fill="#fff" stroke="#000" stroke-width="3.5"/>
  <text x="1288" y="607" text-anchor="middle" fill="#000">CFG fixpoint</text>

  <!-- Statement semantics -->
  <rect x="1122" y="797" width="348" height="148" rx="14" fill="#fff" stroke="#0070C0" stroke-width="3.5"/>
  <text x="1288" y="852" text-anchor="middle" fill="#000">Statement</text>
  <text x="1288" y="917" text-anchor="middle" fill="#000">semantics</text>

  <!-- Abstract State -->
  <rect x="1621" y="515" width="393" height="436" rx="14" fill="#fff" stroke="#0E9B52" stroke-width="3.5"/>
  <text x="1818" y="568" text-anchor="middle" fill="#000">Abstract State</text>
  <rect x="1643" y="616" width="349" height="148" rx="14" fill="#fff" stroke="#0E9B52" stroke-width="3.5"/>
  <text x="1797" y="658" text-anchor="middle" fill="#000">Heap</text>
  <text x="1797" y="724" text-anchor="middle" fill="#000">Domain</text>
  <rect x="1643" y="786" width="349" height="148" rx="14" fill="#fff" stroke="#0E9B52" stroke-width="3.5"/>
  <text x="1812" y="844" text-anchor="middle" fill="#000">Value</text>
  <text x="1812" y="910" text-anchor="middle" fill="#000">Domain</text>

  <!-- Internal arrows -->
  <line x1="972" y1="732" x2="1118" y2="598" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1120" y1="870" x2="974" y2="735" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1296" y1="669" x2="1296" y2="794" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1472" y1="870" x2="1618" y2="735" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="1818" y1="515" x2="1818" y2="428" stroke="#000" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g stroke="#0070C0" transform="translate(102,775)"><use href="#star"/></g>
  <text x="128" y="793" fill="#0070C0">language</text>
  <text x="132" y="860" fill="#0070C0">dependent</text>
  <g stroke="#0E9B52" transform="translate(102,922)"><use href="#star"/></g>
  <text x="128" y="940" fill="#0E9B52">configurable</text>
</svg>
